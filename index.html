```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers Leaderboard</title>

<style>
:root {
    --bg: #0b1220;
    --card: #111a2e;
    --card2: #0f172a;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #f59e0b;
    --ht: #fb7185;
    --lt: #4ade80;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: var(--text);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: rgba(15,23,42,0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #1f2937;
}

header h1 {
    font-size: 1.8rem;
    color: var(--accent);
    margin: 0;
}

.search-bar input {
    background: #020617;
    border: 1px solid #1f2937;
    padding: 10px 14px;
    border-radius: 10px;
    color: white;
    width: 220px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

/* TABS */
.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

.tab {
    padding: 10px 16px;
    border-radius: 10px;
    background: #020617;
    border: 1px solid #1f2937;
    color: white;
    cursor: pointer;
}

.tab.active {
    background: var(--accent);
    color: black;
}

/* PLAYER ROW */
.player-row {
    display: grid;
    grid-template-columns: 70px 300px 180px 1fr;
    background: linear-gradient(145deg, #020617, #0f172a);
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 18px 25px;
    margin-bottom: 12px;
    align-items: center;
}

.rank {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--accent);
}

.player-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar {
    width: 50px;
    height: 50px;
    border-radius: 8px;
}

.player-name {
    font-size: 1.2rem;
    font-weight: 600;
}

.points {
    color: var(--accent);
    font-weight: bold;
}

.tiers-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tier-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: bold;
}

.HT {
    background: rgba(251,113,133,0.15);
    color: var(--ht);
    border: 1px solid var(--ht);
}

.LT {
    background: rgba(74,222,128,0.15);
    color: var(--lt);
    border: 1px solid var(--lt);
}

.error {
    text-align: center;
    margin-top: 40px;
    color: #f87171;
}
</style>
</head>

<body>

<header>
    <h1>MMTiers</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
</header>

<div class="container">

    <!-- TABS -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('overall', this)">Overall</button>
        <button class="tab" onclick="switchTab('crystal', this)">Crystal</button>
        <button class="tab" onclick="switchTab('sword', this)">Sword</button>
        <button class="tab" onclick="switchTab('uhc', this)">UHC</button>
        <button class="tab" onclick="switchTab('smp', this)">SMP</button>
        <button class="tab" onclick="switchTab('dsmp', this)">DSMP</button>
        <button class="tab" onclick="switchTab('netpot', this)">NetPot</button>
        <button class="tab" onclick="switchTab('dpot', this)">DPot</button>
        <button class="tab" onclick="switchTab('cart', this)">Cart</button>
        <button class="tab" onclick="switchTab('mace', this)">Mace</button>
        <button class="tab" onclick="switchTab('diasmp', this)">DiaSMP</button>
    </div>

    <div id="leaderboard">Loading rankings...</div>
</div>

<script>
const tierPoints = {
  "HT1": 60, "LT1": 45,
  "HT2": 35, "LT2": 25,
  "HT3": 15, "LT3": 6,
  "HT4": 4, "LT4": 3,
  "HT5": 2, "LT5": 1
};

let leaderboardData = [];
let currentMode = "overall";

async function loadLeaderboard() {
    const response = await fetch('api-1.json');
    const data = await response.json();

    leaderboardData = data.map(player => {
        let totalPoints = 0;

        Object.values(player.rankings || {}).forEach(info => {
            const type = info.pos === 0 ? "HT" : "LT";
            totalPoints += tierPoints[type + info.tier] || 0;
        });

        return { ...player, points: totalPoints };
    });

    leaderboardData.sort((a,b) => b.points - a.points);
    renderLeaderboard();
}

function switchTab(mode, el) {
    currentMode = mode;

    document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    renderLeaderboard();
}

function renderLeaderboard(search = "") {
    const container = document.getElementById('leaderboard');
    container.innerHTML = "";

    let filtered = leaderboardData.filter(player =>
        player.name.toLowerCase().includes(search.toLowerCase())
    );

    if (currentMode !== "overall") {
        filtered = filtered.map(player => {
            const data = player.rankings?.[currentMode];
            if (!data) return null;

            const type = data.pos === 0 ? "HT" : "LT";
            const score = tierPoints[type + data.tier] || 0;

            return { ...player, modeData: data, score };
        }).filter(Boolean);

        filtered.sort((a,b) => b.score - a.score);
    }

    if(filtered.length === 0) {
        container.innerHTML = `<div class="error">No players found.</div>`;
        return;
    }

    filtered.forEach((player,index) => {
        const row = document.createElement("div");
        row.className = "player-row";

        let tierHTML = "";

        if (currentMode === "overall") {
            Object.values(player.rankings || {}).forEach(info => {
                const type = info.pos === 0 ? "HT" : "LT";
                tierHTML += `<div class="tier-badge ${type}">${type}${info.tier}</div>`;
            });
        } else {
            const info = player.modeData;
            const type = info.pos === 0 ? "HT" : "LT";
            tierHTML = `<div class="tier-badge ${type}">${type}${info.tier}</div>`;
        }

        row.innerHTML = `
            <div class="rank">#${index+1}</div>
            <div class="player-info">
                <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid}/100">
                <span class="player-name">${player.name}</span>
            </div>
            <div class="points">${player.points} pts</div>
            <div class="tiers-list">${tierHTML}</div>
        `;

        container.appendChild(row);
    });
}

document.getElementById('searchInput').addEventListener('input', e => {
    renderLeaderboard(e.target.value);
});

loadLeaderboard();
</script>

</body>
</html>
