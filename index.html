<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers Modern Rows</title>
<style>
:root {
  --bg: #0b1220;
  --text: #e5e7eb;
  --accent: #f59e0b;
  --ht: #fb7185;
  --lt: #4ade80;
  --fade-duration: 0.3s;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: var(--text);
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: rgba(11,18,32,0.85);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid #1f2937;
}

header h1 {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 2rem;
  letter-spacing: 2px;
  background: linear-gradient(45deg, #f59e0b, #facc15);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 0;
}

/* SEARCH BAR */
.search-bar input {
  padding: 0.5rem 1rem;
  border-radius: 12px;
  background: rgba(2,6,23,0.7);
  border: 1px solid #1f2937;
  color: var(--text);
  outline: none;
  transition: all 0.2s ease;
}

.search-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(245,158,11,0.5);
}

/* TABS */
.tabs {
  display: flex;
  overflow-x: auto;
  padding: 1rem 2rem;
  gap: 0.5rem;
}

.tab {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  background: rgba(2,6,23,0.7);
  border-radius: 999px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.25s ease;
  flex-shrink: 0;
  color: #facc15;
}

.tab:hover {
  background: rgba(2,6,23,0.9);
}

.tab.active {
  background: var(--accent);
  color: #facc15;
  font-weight: 600;
}

/* LEADERBOARD */
#leaderboard {
  padding: 1rem 2rem;
  transition: opacity var(--fade-duration) ease;
  opacity: 1;
}

#leaderboard.fade-out {
  opacity: 0;
}

/* PLAYER ROWS */
.player-row {
  display: grid;
  grid-template-columns: 60px 1.5fr 1fr 2fr;
  align-items: center;
  padding: 1rem;
  background: rgba(17,24,39,0.85);
  border-radius: 16px;
  border: 1px solid #1f2937;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.player-row:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.7);
}

.rank {
  font-weight: bold;
  color: var(--accent);
}

.player-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  object-fit: cover;
}

.tiers-list {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.tier-badge {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.25rem 0.7rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 500;
}

.HT {
  background: rgba(251,113,133,0.2);
  color: var(--ht);
}

.LT {
  background: rgba(74,222,128,0.2);
  color: var(--lt);
}

/* NEW STYLE FOR GAMEMODE ROWS */
.tier-row {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 1rem;
}

.tier-label {
  min-width: 80px;
  font-weight: bold;
  color: var(--accent);
}

.tier-players {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.player {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.6rem;
  border-radius: 8px;
  background: rgba(2,6,23,0.7);
  border-left: 3px solid transparent;
}

.player.HT {
  border-left: 3px solid var(--ht);
}

.player.LT {
  border-left: 3px solid var(--lt);
}
</style>
</head>
<body>

<header>
  <h1>MMTiers</h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search player...">
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard"></div>

<script>
const iconMap = {
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"overall": "https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
};

const modes = ["overall","crystal","sword","uhc","smp","dsmp","netpot","dpot","cart","mace","axe"];
const tierPoints = { "HT1":60,"LT1":45,"HT2":35,"LT2":25,"HT3":15,"LT3":6,"HT4":4,"LT4":3,"HT5":2,"LT5":1};

let leaderboardData = [];
let currentMode = "overall";

const tabsDiv = document.getElementById("tabs");
const leaderboardDiv = document.getElementById("leaderboard");

// CREATE TABS
modes.forEach(mode=>{
  const btn=document.createElement("button");
  btn.className="tab";
  if(mode==="overall") btn.classList.add("active");
  btn.innerHTML=`<img src="${iconMap[mode]}" width="16"> ${mode}`;
  btn.onclick=()=>{
    if(currentMode===mode) return;
    currentMode=mode;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    leaderboardDiv.classList.add('fade-out');
    setTimeout(()=>{ renderLeaderboard(); leaderboardDiv.classList.remove('fade-out'); }, 300);
  };
  tabsDiv.appendChild(btn);
});

// LOAD DATA
async function loadLeaderboard() {
  const res = await fetch('api-1.json');
  leaderboardData = await res.json();
  renderLeaderboard();
}

// RENDER
function renderLeaderboard(search="") {
  leaderboardDiv.innerHTML="";
  let players = leaderboardData.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

  if(currentMode==="overall"){
    players = players.map(p=>{
      let pts=0;
      Object.values(p.rankings||{}).forEach(r=>{
        const type=r.pos===0?"HT":"LT";
        pts+=tierPoints[type+r.tier]||0;
      });
      return {...p, points:pts};
    }).sort((a,b)=>b.points-a.points);

    players.forEach((p,i)=>{
      let tiersHTML="";
      Object.entries(p.rankings||{}).forEach(([mode,info])=>{
        const type = info.pos===0?"HT":"LT";
        tiersHTML+=`<div class="tier-badge ${type}" title="${mode} ${type}${info.tier}"><img src="${iconMap[mode]}" width="16">${type}${info.tier}</div>`;
      });
      const row=document.createElement("div");
      row.className="player-row";
      row.innerHTML=`
        <div class="rank">#${i+1}</div>
        <div class="player-info"><img class="avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}</div>
        <div>${p.points} pts</div>
        <div class="tiers-list">${tiersHTML}</div>`;
      leaderboardDiv.appendChild(row);
    });
    return;
  }

  // OTHER MODES: row per tier
  const tiers = {1:[],2:[],3:[],4:[],5:[]};
  players.forEach(p=>{
    const data=p.rankings?.[currentMode];
    if(!data) return;
    tiers[data.tier].push({name:p.name,uuid:p.uuid,pos:data.pos});
  });

  for(let t=1;t<=5;t++){
    const row = document.createElement("div");
    row.className="tier-row";
    const label = document.createElement("div");
    label.className="tier-label";
    label.textContent="Tier "+t;
    row.appendChild(label);
    const playerContainer = document.createElement("div");
    playerContainer.className="tier-players";
    tiers[t].forEach(p=>{
      const div = document.createElement("div");
      div.className="player "+(p.pos===0?"HT":"LT");
      div.innerHTML=`<img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}`;
      playerContainer.appendChild(div);
    });
    row.appendChild(playerContainer);
    leaderboardDiv.appendChild(row);
  }
}

document.getElementById("searchInput").addEventListener("input",e=>renderLeaderboard(e.target.value));
loadLeaderboard();
</script>
</body>
</html>
