<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --card-bg: #161616;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 1000px; margin: auto; }

        h1 { font-size: 2.5rem; margin-bottom: 30px; }

        .player-row {
            display: grid;
            grid-template-columns: 60px 280px 150px 1fr;
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 20px 30px;
            border-radius: 12px;
            align-items: center;
            border: 1px solid #222;
            transition: transform 0.2s;
        }

        .player-row:hover { transform: scale(1.01); border-color: #444; }

        .rank { font-weight: bold; color: #555; font-size: 1.5rem; }
        
        .player-info { display: flex; align-items: center; gap: 20px; }
        
        .avatar { 
            width: 54px; 
            height: 54px; 
            image-rendering: pixelated; 
            border-radius: 6px;
        }

        .player-name { font-size: 1.4rem; font-weight: 600; }

        .points { color: var(--point-color); font-weight: bold; font-size: 1.3rem; }

        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 1rem; 
            font-weight: 900;
        }
        
        .mode-icon-img {
            width: 30px; 
            height: 30px;
            image-rendering: pixelated;
            object-fit: contain; /* Fixes cobweb squishing */
        }

        .HT { background: rgba(255, 71, 87, 0.1); color: var(--ht-color); border: 1px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.1); color: var(--lt-color); border: 1px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Overall Rankings</h1>
    <div id="leaderboard">Loading rankings...</div>
</div>

<script>
    const iconMap = {
        "crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png/revision/latest?cb=20191218004335",
        "sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png/revision/latest/scale-to-width/360?cb=20201017135722",
        "mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png/revision/latest?cb=20240317084754",
        "smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png/revision/latest/thumbnail/width/360/height/360?cb=20200512195721",
        "dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png?d45f1",
        "dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
        "netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png/revision/latest/scale-to-width/360?cb=20200304213920",
        "uhc": "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827",
        "axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png/revision/latest/scale-to-width/360?cb=20200226193844"
    };

    async function loadLeaderboard() {
        try {
            const response = await fetch('api-1.json');
            const data = await response.json();
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            data.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                let tiersHTML = '';
                // CHANGED THIS LINE: Now looking for 'rankings' to match your JSON
                const rankings = player.rankings || {}; 
                
                Object.entries(rankings).forEach(([mode, info]) => {
                    const type = (info.pos === 0) ? 'HT' : 'LT';
                    const icon = iconMap[mode.toLowerCase()] || "";
                    tiersHTML += `
                        <div class="tier-badge ${type}">
                            <img src="${icon}" class="mode-icon-img" referrerpolicy="no-referrer">
                            <span>${type}${info.tier}</span>
                        </div>
                    `;
                });

                row.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid}/100" alt="head">
                        <span class="player-name">${player.name}</span>
                    </div>
                    <div class="points">${player.points} Points</div>
                    <div class="tiers-list">${tiersHTML}</div>
                `;
                container.appendChild(row);
            });
        } catch (err) {
            document.getElementById('leaderboard').innerHTML = `<div class="error">Failed to load api-1.json. Check your file!</div>`;
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
