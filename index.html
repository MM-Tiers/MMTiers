<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html { zoom: 1.25; }

:root {
  --bg:#0b1220;
  --text:#ffffff;
  --accent:#f59e0b;
  --ht:#fb7185;
  --lt:#4ade80;
}

body {
  margin:0;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:var(--text);
}

header {
  display:flex;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #1f2937;
}

header h1 { color:var(--accent); }

.search-bar input {
  background:#020617;
  border:1px solid #1f2937;
  padding:10px;
  border-radius:10px;
  color:white;
}

.tabs {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:15px;
}

.tab {
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#020617;
  border:1px solid #1f2937;
  border-radius:10px;
  cursor:pointer;
  color:white;
}

.tab img { width:16px; }

.tab.active {
  background:var(--accent);
}

#leaderboard { transition:opacity 0.25s ease; }
.fade-out { opacity:0; }

/* PLAYER ROW */
.player-row {
  display:grid;
  grid-template-columns:50px 1fr 1fr;
  padding:14px;
  margin:10px;
  background:linear-gradient(145deg,#020617,#0f172a);
  border-radius:14px;
  border:1px solid #1f2937;
  cursor:pointer;
}

.rank { color:var(--accent); font-weight:bold; }

.player-info { display:flex; align-items:center; gap:10px; }

.avatar { width:36px; border-radius:6px; }

/* TEXT */
.player-text { display:flex; flex-direction:column; }

.name-line { display:flex; align-items:center; gap:8px; }

.player-name { font-weight:700; }

.achievement {
  font-size:0.7rem;
  padding:2px 8px;
  border-radius:10px;
  background:rgba(245,158,11,0.15);
  color:var(--accent);
}

.points { font-size:0.8rem; color:#cbd5e1; }

/* TIERS */
.tiers-list { display:flex; flex-wrap:wrap; gap:6px; }

.tier-badge {
  display:flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border-radius:6px;
  font-size:0.75rem;
}

.HT { background:rgba(251,113,133,0.15); color:var(--ht); }
.LT { background:rgba(74,222,128,0.15); color:var(--lt); }

/* TOP 3 */
.top1, .top2, .top3 { transform:scale(1.02); position:relative; }

.top1 { border:1px solid gold; box-shadow:0 0 20px rgba(255,215,0,0.4); }
.top2 { border:1px solid #c0c0c0; box-shadow:0 0 15px rgba(192,192,192,0.4); }
.top3 { border:1px solid #cd7f32; box-shadow:0 0 15px rgba(205,127,50,0.4); }

.top1::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, transparent, rgba(255,215,0,0.3), transparent);
  animation:shine 2s infinite;
}

@keyframes shine {
  0% { transform:translateX(-100%); }
  100% { transform:translateX(100%); }
}
</style>

</head>

<body>

<header>
<h1>MMTiers</h1>
<div class="search-bar">
<input id="searchInput" placeholder="Search player...">
</div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard">Loading...</div>

<script>
const iconMap={
overall:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png",
crystal:"https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
sword:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
uhc:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
smp:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png"
};

const modes=["overall","crystal","sword","uhc","smp"];
const tierPoints={HT1:60,LT1:45,HT2:35,LT2:25,HT3:15,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};

let data=[];
let currentMode="overall";

init();

async function init(){
  createTabs();
  await loadData();
  render();
}

async function loadData(){
  const res=await fetch("api-1.json");
  data=await res.json();
}

function createTabs(){
  const tabs=document.getElementById("tabs");
  modes.forEach(m=>{
    const btn=document.createElement("button");
    btn.className="tab";
    if(m==="overall") btn.classList.add("active");
    btn.innerHTML=`<img src="${iconMap[m]}">${m}`;
    btn.onclick=()=>switchTab(m,btn);
    tabs.appendChild(btn);
  });
}

function switchTab(mode,btn){
  currentMode=mode;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function getPoints(p){
  let pts=0;
  Object.values(p.rankings||{}).forEach(r=>{
    const type=r.pos===0?"HT":"LT";
    pts+=tierPoints[type+r.tier]||0;
  });
  return pts;
}

function getAchievementTitle(points){
  if(points>=400) return "Combat Grandmaster";
  if(points>=250) return "Combat Master";
  if(points>=100) return "Combat Ace";
  if(points>=50) return "Combat Specialist";
  if(points>=20) return "Combat Cadet";
  if(points>=10) return "Combat Novice";
  return "Rookie";
}

function computeRanks(players){
  players=players.map(p=>({...p, points:getPoints(p)}));
  players.sort((a,b)=>b.points-a.points);
  let rank=1,last=null,skip=0;
  players.forEach(p=>{
    if(last!==p.points){rank+=skip;skip=1;p.rank=rank;last=p.points;}
    else{p.rank=rank;skip++;}
  });
  return players;
}

function render(){
  const container=document.getElementById("leaderboard");
  const search=document.getElementById("searchInput").value.toLowerCase();

  let players=data.filter(p=>p.name.toLowerCase().includes(search));
  container.innerHTML="";

  if(currentMode==="overall"){
    players=computeRanks(players);

    players.forEach(p=>{
      let tiersHTML="";
      Object.entries(p.rankings||{}).forEach(([m,r])=>{
        const type=r.pos===0?"HT":"LT";
        tiersHTML+=`<div class="tier-badge ${type}"><img src="${iconMap[m]}">${type}${r.tier}</div>`;
      });

      const row=document.createElement("div");
      row.className="player-row";

      if(p.rank===1) row.classList.add("top1");
      if(p.rank===2) row.classList.add("top2");
      if(p.rank===3) row.classList.add("top3");

      row.innerHTML=`
        <div class="rank">
          ${p.rank===1?"👑":p.rank===2?"🥈":p.rank===3?"🥉":"#"+p.rank}
        </div>

        <div class="player-info">
          <img class="avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">
          <div class="player-text">
            <div class="name-line">
              <span class="player-name">${p.name}</span>
              <span class="achievement">${getAchievementTitle(p.points)}</span>
            </div>
            <div class="points">${p.points} pts</div>
          </div>
        </div>

        <div class="tiers-list">${tiersHTML}</div>
      `;

      container.appendChild(row);
    });
    return;
  }

  // OTHER MODES (unchanged)
  const tiers={1:[],2:[],3:[],4:[],5:[]};
  players.forEach(p=>{
    const r=p.rankings?.[currentMode];
    if(!r) return;
    tiers[r.tier].push({...p,pos:r.pos});
  });

  const grid=document.createElement("div");
  grid.className="tier-grid";

  for(let t=1;t<=5;t++){
    const col=document.createElement("div");
    col.className="tier-column";
    col.innerHTML=`<div class="tier-title">Tier ${t}</div>`;
    tiers[t].forEach(p=>{
      const div=document.createElement("div");
      div.className=`player ${p.pos===0?"HT":"LT"}`;
      div.innerHTML=`<img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}`;
      col.appendChild(div);
    });
    grid.appendChild(col);
  }

  container.appendChild(grid);
}

document.getElementById("searchInput").addEventListener("input",render);
</script>

</body>
</html>
