<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 900px; margin: auto; }

        .player-row {
            display: grid;
            grid-template-columns: 50px 250px 120px 1fr;
            background: var(--card-bg);
            margin-bottom: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            align-items: center;
            border: 1px solid #333;
            transition: transform 0.2s, background 0.2s;
        }

        .player-row:hover {
            background: #252525;
            transform: scale(1.01);
        }

        .rank { font-weight: bold; color: #555; font-size: 1.1rem; }
        
        .player-info { display: flex; align-items: center; gap: 15px; }
        
        /* Steve Face Styling */
        .avatar { 
            width: 40px; 
            height: 40px; 
            image-rendering: pixelated; /* Keeps the Steve face sharp */
            border-radius: 4px;
        }

        .points { color: var(--point-color); font-weight: bold; }

        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 900;
        }
        
        .mode-icon-img {
            width: 18px;
            height: 18px;
            image-rendering: pixelated;
        }

        .HT { background: rgba(255, 71, 87, 0.1); color: var(--ht-color); border: 1px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.1); color: var(--lt-color); border: 1px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom: 30px;">Overall Rankings</h1>
    <div id="leaderboard">Loading...</div>
</div>

<script>
    /** * ICON CONFIGURATION:
     * Replace 'YOUR_FILE_NAME.png' with the actual filenames you uploaded to GitHub.
     */
    const iconMap = {
        "crystal": "image_7dde60.png",
        "cart pvp": "image_7dddc5.png",
        "sword": "image_7ddda5.png",
        "mace": "image_7dda9e.png",
        "smp": "image_7dda3d.png",
        "diamond pot": "image_7dd9fc.png",
        "diamond smp": "image_7dd99f.png",
        "netite pot": "image_7dd6d8.png",
        "uhc": "image_7dd6a0.png",
        "axe": "image_7dd65e.png"
    };

    function createTierBadge(modeName, data) {
        const type = (data.pos === 0) ? 'HT' : 'LT';
        const iconFile = iconMap[modeName.toLowerCase()];
        
        // If the icon exists, show it; otherwise, just show the text
        const iconHtml = iconFile ? `<img src="${iconFile}" class="mode-icon-img">` : "";
        
        return `
            <span class="tier-badge ${type}">
                ${iconHtml}
                ${type}${data.tier}
            </span>`;
    }

    async function loadLeaderboard() {
        const board = document.getElementById('leaderboard');
        try {
            const response = await fetch('api-1.json'); 
            if (!response.ok) throw new Error("File 'api-1.json' not found");
            
            const players = await response.json();
            players.sort((a, b) => b.points - a.points);

            board.innerHTML = players.map((p, i) => `
                <div class="player-row">
                    <div class="rank">#${i + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/avatar/steve/100">
                        <strong>${p.name}</strong>
                    </div>
                    <div class="points">${p.points} PTS</div>
                    <div class="tiers-list">
                        ${Object.entries(p.rankings).map(([mode, data]) => createTierBadge(mode, data)).join('')}
                    </div>
                </div>
            `).join('');

        } catch (err) {
            board.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
    }

    loadLeaderboard();
</script>
</body>
</html>
