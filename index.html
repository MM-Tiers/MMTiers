<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06090f;--surface:#0c1018;--card:#0f1420;--card-hover:#141b28;--border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.12);--text:#f0f2f5;--text2:#8a92a4;--text3:#555d6e;--accent:#f59e0b;--accent-dim:rgba(245,158,11,.12);--ht:#fb7185;--ht-dim:rgba(251,113,133,.1);--lt:#4ade80;--lt-dim:rgba(74,222,128,.1);--pk:#c084fc;--gold:#fbbf24;--silver:#94a3b8;--bronze:#d97706;--retired:#facc15;--ret-dim:rgba(250,204,21,.12);--crht:#ef4444;--crlt:#22d3ee;--r:14px;--rs:10px;--rx:8px;--tr:.22s cubic-bezier(.4,0,.2,1)}
html{font-size:17.6px;scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
@keyframes fadeRow{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes stG{0%,100%{filter:drop-shadow(0 0 4px rgba(251,191,36,.6));transform:scale(1)}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.8));transform:scale(1.08)}}
@keyframes stGA{0%,100%{filter:drop-shadow(0 0 5px rgba(251,191,36,.8));transform:scale(1.05)}50%{filter:drop-shadow(0 0 10px rgba(251,191,36,1));transform:scale(1.14)}}
@keyframes lgG{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes gmGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,255,255,.3)) drop-shadow(0 0 12px rgba(251,113,133,.35)) drop-shadow(0 0 12px rgba(34,211,238,.25))}50%{filter:drop-shadow(0 0 14px rgba(251,113,133,.6)) drop-shadow(0 0 18px rgba(34,211,238,.5)) drop-shadow(0 0 10px rgba(255,255,255,.4))}}
@keyframes msGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(251,191,36,.3)) drop-shadow(0 0 12px rgba(239,68,68,.3)) drop-shadow(0 0 12px rgba(251,146,60,.25))}50%{filter:drop-shadow(0 0 14px rgba(239,68,68,.55)) drop-shadow(0 0 18px rgba(251,146,60,.5)) drop-shadow(0 0 10px rgba(251,191,36,.4))}}
@keyframes mmG{0%,100%{filter:drop-shadow(0 0 8px rgba(34,211,238,.5)) drop-shadow(0 0 16px rgba(74,222,128,.35));background-position:0% 50%}50%{filter:drop-shadow(0 0 14px rgba(34,211,238,.75)) drop-shadow(0 0 26px rgba(74,222,128,.55));background-position:100% 50%}}
@keyframes dvG{0%,100%{filter:drop-shadow(0 0 8px rgba(168,85,247,.5)) drop-shadow(0 0 16px rgba(236,72,153,.35));background-position:0% 50%}50%{filter:drop-shadow(0 0 14px rgba(168,85,247,.75)) drop-shadow(0 0 26px rgba(236,72,153,.55));background-position:100% 50%}}
@keyframes rnG{0%,100%{filter:drop-shadow(0 0 8px rgba(248,113,113,.5)) drop-shadow(0 0 16px rgba(251,146,60,.35));background-position:0% 50%}50%{filter:drop-shadow(0 0 14px rgba(248,113,113,.75)) drop-shadow(0 0 26px rgba(251,146,60,.55));background-position:100% 50%}}
@keyframes oBG{0%,100%{border-color:rgba(34,211,238,.4);box-shadow:0 0 14px rgba(34,211,238,.18),0 0 32px rgba(74,222,128,.12)}50%{border-color:rgba(74,222,128,.55);box-shadow:0 0 22px rgba(74,222,128,.28),0 0 48px rgba(34,211,238,.2)}}
@keyframes dBG{0%,100%{border-color:rgba(168,85,247,.4);box-shadow:0 0 14px rgba(168,85,247,.18),0 0 32px rgba(236,72,153,.12)}50%{border-color:rgba(236,72,153,.55);box-shadow:0 0 22px rgba(236,72,153,.28),0 0 48px rgba(168,85,247,.2)}}
@keyframes rBG{0%,100%{border-color:rgba(248,113,113,.4);box-shadow:0 0 14px rgba(248,113,113,.18),0 0 32px rgba(251,146,60,.12)}50%{border-color:rgba(251,146,60,.55);box-shadow:0 0 22px rgba(251,146,60,.28),0 0 48px rgba(248,113,113,.2)}}
@keyframes pp{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes ccGlow{0%,100%{box-shadow:0 0 15px rgba(239,68,68,.3),inset 0 0 15px rgba(239,68,68,.05)}50%{box-shadow:0 0 25px rgba(239,68,68,.5),inset 0 0 20px rgba(239,68,68,.1)}}
@keyframes ytGlow{0%,100%{box-shadow:0 0 8px rgba(255,0,0,.2)}50%{box-shadow:0 0 16px rgba(255,0,0,.4)}}
@keyframes legBorder{0%,100%{border-color:rgba(251,191,36,.18);box-shadow:0 0 12px rgba(251,191,36,.06)}50%{border-color:rgba(251,191,36,.35);box-shadow:0 0 22px rgba(251,191,36,.12)}}
@keyframes glG{0%,100%{text-shadow:0 0 8px rgba(251,191,36,.6),0 0 16px rgba(251,191,36,.3)}50%{text-shadow:0 0 12px rgba(251,191,36,.8),0 0 24px rgba(251,191,36,.4)}}
@keyframes goldBorder{0%,100%{border-color:rgba(251,191,36,.2);box-shadow:0 0 12px rgba(251,191,36,.06)}50%{border-color:rgba(251,191,36,.4);box-shadow:0 0 24px rgba(251,191,36,.14)}}
@keyframes silverBorder{0%,100%{border-color:rgba(148,163,184,.18);box-shadow:0 0 10px rgba(148,163,184,.05)}50%{border-color:rgba(148,163,184,.35);box-shadow:0 0 20px rgba(148,163,184,.12)}}
@keyframes bronzeBorder{0%,100%{border-color:rgba(217,119,6,.18);box-shadow:0 0 10px rgba(217,119,6,.05)}50%{border-color:rgba(217,119,6,.35);box-shadow:0 0 20px rgba(217,119,6,.12)}}
@keyframes silverGlG{0%,100%{text-shadow:0 0 8px rgba(148,163,184,.5),0 0 16px rgba(148,163,184,.2)}50%{text-shadow:0 0 12px rgba(148,163,184,.7),0 0 24px rgba(148,163,184,.35)}}
@keyframes bronzeGlG{0%,100%{text-shadow:0 0 8px rgba(217,119,6,.5),0 0 16px rgba(217,119,6,.2)}50%{text-shadow:0 0 12px rgba(217,119,6,.7),0 0 24px rgba(217,119,6,.35)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}#bgCanvas{display:none}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px}
header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(6,9,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(245,158,11,.1);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.logo{height:52px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(251,146,60,.8)) drop-shadow(0 0 28px rgba(251,191,36,.5));transition:transform .3s}.logo:hover{transform:scale(1.04)}
.header-right{display:flex;align-items:center;gap:8px}
.info-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;background:var(--surface);border:1px solid rgba(245,158,11,.1);border-radius:var(--rx);color:var(--text2);font-size:.78rem;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit}
.info-btn:hover{color:var(--accent);border-color:rgba(245,158,11,.3);background:var(--accent-dim)}
.discord-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(0,0,0,.45);border:1px solid rgba(88,101,242,.4);border-radius:var(--rx);color:rgba(88,101,242,.8);font-size:.78rem;font-weight:700;text-decoration:none;transition:var(--tr)}
.discord-btn:hover{background:rgba(88,101,242,.07);border-color:rgba(88,101,242,.7);color:#5865f2}
.discord-btn svg{width:16px;height:16px;fill:currentColor}
.tiktok-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:linear-gradient(135deg,rgba(236,72,153,.08),rgba(34,211,238,.08));border:1px solid rgba(236,72,153,.35);border-radius:var(--rx);color:rgba(236,72,153,.75);font-size:.78rem;font-weight:700;text-decoration:none;transition:var(--tr)}
.tiktok-btn:hover{border-color:rgba(34,211,238,.6);color:#22d3ee}
.tiktok-btn svg{width:15px;height:15px;fill:currentColor}
.search-bar{position:relative}
.search-bar::before{content:"\1F50D";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.8rem;pointer-events:none;opacity:.4}
.search-bar input{background:var(--surface);border:1px solid var(--border);padding:9px 14px 9px 36px;border-radius:var(--rx);color:var(--text);font-family:inherit;font-size:.82rem;width:200px;outline:none;transition:var(--tr)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.tabs-wrapper{position:sticky;top:76px;z-index:90;background:rgba(6,9,15,.75);backdrop-filter:blur(14px);padding:10px 24px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:8px 16px;background:transparent;border:1px solid transparent;border-radius:var(--rx);cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;white-space:nowrap;transition:var(--tr)}
.tab-emoji{font-size:.95rem}
.tab:hover{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06)}
.tab-separator{width:1px;background:rgba(255,255,255,.06);margin:0 2px;flex-shrink:0;align-self:stretch}
.tab[data-mode="legends"]{color:rgba(251,191,36,.5);background:rgba(251,191,36,.015);border-color:rgba(251,191,36,.04)}
.tab[data-mode="legends"].active{color:#fbbf24;border-color:rgba(251,191,36,.7);box-shadow:0 0 0 1.5px rgba(251,191,36,.65),0 0 10px rgba(251,191,36,.35);text-shadow:0 0 10px rgba(251,191,36,.6)}
.tab[data-mode="halloffame"]{color:rgba(251,191,36,.5);background:rgba(251,191,36,.015);border-color:rgba(251,191,36,.04)}
.tab[data-mode="halloffame"].active{color:#fbbf24;border-color:rgba(251,191,36,.7);box-shadow:0 0 0 1.5px rgba(251,191,36,.65),0 0 10px rgba(251,191,36,.35);text-shadow:0 0 10px rgba(251,191,36,.6)}
.tab[data-mode="maintiers"]{color:rgba(34,211,238,.45);background:rgba(34,211,238,.015);border-color:rgba(34,211,238,.04)}
.tab[data-mode="maintiers"].active{color:#22d3ee;border-color:rgba(34,211,238,.7);box-shadow:0 0 0 1.5px rgba(34,211,238,.6),0 0 10px rgba(34,211,238,.3);text-shadow:0 0 10px rgba(34,211,238,.5)}
.tab[data-mode="subtiers"]{color:rgba(192,132,252,.45);background:rgba(192,132,252,.015);border-color:rgba(192,132,252,.04)}
.tab[data-mode="subtiers"].active{color:#c084fc;border-color:rgba(192,132,252,.7);box-shadow:0 0 0 1.5px rgba(192,132,252,.6),0 0 10px rgba(192,132,252,.3);text-shadow:0 0 10px rgba(192,132,252,.5)}
.tab[data-mode="subtiers"] .tab-emoji{color:#c084fc;filter:drop-shadow(0 0 6px rgba(192,132,252,.6))}
.tab[data-mode="teams"]{color:rgba(74,222,128,.45);background:rgba(74,222,128,.015);border-color:rgba(74,222,128,.04)}
.tab[data-mode="teams"].active{color:#4ade80;border-color:rgba(74,222,128,.7);box-shadow:0 0 0 1.5px rgba(74,222,128,.6),0 0 10px rgba(74,222,128,.3);text-shadow:0 0 10px rgba(74,222,128,.5)}
.sub-tabs-wrapper{overflow:hidden;max-height:0;opacity:0;transition:max-height .25s,opacity .2s,padding .25s;padding:0 24px}
.sub-tabs-wrapper.visible{max-height:80px;opacity:1;padding:10px 24px 14px}
.sub-tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:3px 0}.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{display:flex;align-items:center;height:54px;padding:0 11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;cursor:pointer;color:var(--text2);font-family:inherit;white-space:nowrap;transition:var(--tr);flex-shrink:0;overflow:hidden}
.sub-tab-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;transition:transform .25s}
.sub-tab-icon img{width:30px;height:30px;object-fit:contain;mix-blend-mode:screen;transition:filter .3s}
.sub-tab:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);transform:translateY(-1px)}
.sub-tab:hover .sub-tab-icon{transform:scale(1.06)}
.sub-tab-label{display:block;max-width:0;opacity:0;overflow:hidden;font-size:.8rem;font-weight:700;transition:max-width .25s,opacity .12s .02s,padding-left .25s;padding-left:0;white-space:nowrap}
.sub-tab:hover .sub-tab-label{max-width:130px;opacity:.5;padding-left:9px}
.sub-tab.active .sub-tab-icon{transform:scale(1.04)}
.sub-tab.active .sub-tab-label{max-width:140px;opacity:1;padding-left:9px}
.sub-tab-icon-emoji{font-size:24px;line-height:1;display:block}
.sub-tab-star{font-size:26px;line-height:1;display:block;filter:drop-shadow(0 0 4px rgba(251,191,36,.6));animation:stG 2.5s ease-in-out infinite}
.sub-tab.active .sub-tab-star{animation:stGA 2s ease-in-out infinite}
#leaderboard{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:20px 14px 50px;transition:opacity .15s}
.fade-out{opacity:0}
.player-row{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:16px;padding:20px 22px;margin-bottom:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:var(--tr);position:relative;overflow:hidden;animation:fadeRow .3s ease-out both}
.player-row::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.01),transparent);pointer-events:none}
.player-row:hover{background:var(--card-hover);border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.avatar{width:72px;height:94px;border-radius:8px;border:none;object-fit:cover;object-position:center top;background:#0a0e14;transition:transform .25s;box-shadow:0 3px 12px rgba(0,0,0,.4);flex-shrink:0}
.avatar-error{visibility:hidden!important}
.player-row:hover .avatar:not(.avatar-error){transform:scale(1.04)}
.player-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.name-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rank{font-weight:900;font-size:1.8rem;color:var(--text3);min-width:52px;flex-shrink:0;line-height:1}
.player-name{font-weight:800;font-size:1.25rem;line-height:1.2}
.achievement{font-size:.62rem;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.02em;text-transform:uppercase;flex-shrink:0;align-self:flex-start;position:relative;overflow:hidden}
.achievement::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shimmer 3s ease-in-out infinite;pointer-events:none}
.achievement.grandmaster{background:linear-gradient(90deg,#ffffff,#fb7185,#22d3ee,#ec4899,#06b6d4,#ffffff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 6s linear infinite,gmGlow 4s ease-in-out infinite}
.achievement.master{background:linear-gradient(90deg,#fbbf24,#ef4444,#fb923c,#f59e0b,#f87171,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 7s linear infinite,msGlow 4.5s ease-in-out infinite}
.achievement.ace{background:linear-gradient(90deg,#fb7185,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 8px rgba(251,113,133,.5));animation:lgG 5s linear infinite;background-size:200% 100%}
.achievement.specialist{background:linear-gradient(90deg,#a855f7,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 8px rgba(168,85,247,.5));animation:lgG 6s linear infinite;background-size:200% 100%}
.achievement.cadet{background:rgba(59,130,246,.12);color:#60a5fa}
.achievement.novice{background:rgba(148,163,184,.12);color:#94a3b8}
.achievement.rookie{background:rgba(100,116,139,.1);color:#64748b}
.points{font-size:.95rem;color:var(--text2);font-weight:700}
.tiers-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tier-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 5px 5px;border-radius:var(--rx);cursor:default;border:1px solid transparent;white-space:nowrap;width:50px;min-height:52px;transition:var(--tr)}
.tier-badge img{width:22px;height:22px;object-fit:contain;flex-shrink:0;mix-blend-mode:screen}
.tb-label{font-size:.6rem;font-weight:800;letter-spacing:.02em;line-height:1}
.tier-badge.HT{background:rgba(251,113,133,.12);color:var(--ht);border-color:rgba(251,113,133,.18)}
.tier-badge.LT{background:rgba(74,222,128,.12);color:var(--lt);border-color:rgba(74,222,128,.18)}
.tier-badge.RHT,.tier-badge.RLT{background:var(--ret-dim);color:var(--retired);border-color:rgba(250,204,21,.12)}
.tier-badge.CRHT{background:rgba(239,68,68,.1);color:var(--crht);border-color:rgba(239,68,68,.12)}
.tier-badge.CRLT{background:rgba(34,211,238,.1);color:var(--crlt);border-color:rgba(34,211,238,.12)}
.tier-badge.has-peaked{border-color:rgba(192,132,252,.22);box-shadow:0 0 6px rgba(192,132,252,.08)}
.player-row:hover .tier-badge.HT{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.28)}
.player-row:hover .tier-badge.LT{background:rgba(74,222,128,.18);border-color:rgba(74,222,128,.28)}
.player-row:hover .tier-badge.RHT,.player-row:hover .tier-badge.RLT{background:rgba(250,204,21,.18);border-color:rgba(250,204,21,.2)}
.player-row:hover .tier-badge.CRHT{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.2)}
.player-row:hover .tier-badge.CRLT{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.2)}
.player-row:hover .tier-badge.has-peaked{border-color:rgba(192,132,252,.32);box-shadow:0 0 10px rgba(192,132,252,.14)}
.top1{border-color:rgba(251,191,36,.22);background:linear-gradient(135deg,rgba(251,191,36,.06),var(--card) 50%);animation:goldBorder 3s ease-in-out infinite,fadeRow .3s ease-out both}
.top1 .rank{color:var(--gold);animation:glG 2.5s ease-in-out infinite}
.top1:hover{box-shadow:0 6px 24px rgba(251,191,36,.1)}
.top2{border-color:rgba(148,163,184,.2);background:linear-gradient(135deg,rgba(148,163,184,.04),var(--card) 50%);animation:silverBorder 3s ease-in-out infinite,fadeRow .3s ease-out both}
.top2 .rank{color:var(--silver);animation:silverGlG 2.5s ease-in-out infinite}
.top2:hover{box-shadow:0 6px 24px rgba(148,163,184,.08)}
.top3{border-color:rgba(217,119,6,.2);background:linear-gradient(135deg,rgba(217,119,6,.04),var(--card) 50%);animation:bronzeBorder 3s ease-in-out infinite,fadeRow .3s ease-out both}
.top3 .rank{color:var(--bronze);animation:bronzeGlG 2.5s ease-in-out infinite}
.top3:hover{box-shadow:0 6px 24px rgba(217,119,6,.08)}
.legend-row{border-color:rgba(251,191,36,.22);background:linear-gradient(135deg,rgba(251,191,36,.05),var(--card) 50%);animation:legBorder 3s ease-in-out infinite,fadeRow .3s ease-out both}
.legend-row .rank{color:var(--gold);animation:glG 2.5s ease-in-out infinite}
.legend-row:hover{box-shadow:0 6px 24px rgba(251,191,36,.1)}
.tier-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.tier-column{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:var(--tr)}
.tier-column:hover{transform:translateY(-2px)}
.tier-title{padding:16px 12px 14px;text-align:center;font-weight:800;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;position:relative}
.tier-title::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:50%;height:2px;border-radius:2px}
.tier-players{padding:12px 10px 14px;flex:1;display:flex;flex-direction:column;gap:5px;min-height:40px}
.tier-column[data-tier="1"]{background:linear-gradient(180deg,rgba(251,191,36,.15),rgba(251,191,36,.06) 30%,var(--card) 80%);border-color:rgba(251,191,36,.18)}
.tier-column[data-tier="1"] .tier-title{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.6)}
.tier-column[data-tier="1"] .tier-title::after{background:rgba(251,191,36,.5)}
.tier-column[data-tier="2"]{background:linear-gradient(180deg,rgba(148,163,184,.12),rgba(148,163,184,.05) 30%,var(--card) 80%);border-color:rgba(148,163,184,.14)}

function rLegends(players){var ct=document.getElementById("leaderboard"),frag=document.createDocumentFragment();var dl=players.filter(function(p){return hasCR(p);});if(!dl.length){ct.innerHTML='<div class="es"><div style="font-size:2.5rem;margin-bottom:12px;opacity:.4">\uD83D\uDC51</div><div style="font-size:.9rem">No legends yet</div></div>';return;}dl.sort(function(a,b){return gMP(b,allM)-gMP(a,allM);});for(var i=0;i<dl.length;i++){var p=dl[i],pts=gMP(p,allM),ti=gAT(pts);var row=document.createElement("div");row.className="player-row legend-row";row.tabIndex=0;row._pd={name:p.name,uuid:p.uuid,rankings:p.rankings,points:pts};row.style.animationDelay=(i*.05)+"s";var fm2=allM,te=[];for(var k in p.rankings){if(p.rankings.hasOwnProperty(k)&&fm2.indexOf(k)!==-1){var res=bTB(k,p.rankings[k],fm2);if(res.h)te.push({h:res.h,p:res.p});}}te.sort(function(a,b){return b.p-a.p;});var th="";for(var j=0;j<te.length;j++)th+=te[j].h;row.innerHTML='<img class="avatar" src="https://mc-heads.net/body/'+p.uuid+'/100" loading="lazy" onerror="this.classList.add(\'avatar-error\')"><div class="player-info"><div class="name-line"><span class="rank">#'+(i+1)+'</span><span class="player-name">'+esc(p.name)+'</span></div><span class="achievement '+ti.c+'">'+esc(ti.n)+'</span><div class="points">'+pts+" pts</div></div>"+(th?'<div class="tiers-grid">'+th+"</div>":"");(function(pd,rn,pt){row.onclick=function(){oP(pd,rn,pt,"LEGENDS");};row.onkeydown=function(e){if(e.key==="Enter")oP(pd,rn,pt,"LEGENDS");};})({name:p.name,uuid:p.uuid,rankings:p.rankings},i+1,pts);frag.appendChild(row);}ct.appendChild(frag);}
function rRanked(players,pFn,filterM,searching){var ct=document.getElementById("leaderboard"),frag=document.createDocumentFragment();var dl=players.map(function(p){return{name:p.name,uuid:p.uuid,rankings:p.rankings,points:pFn(p)};}).filter(function(p){return p.points>0;});dl.sort(function(a,b){return b.points-a.points;});var rk=1;for(var i=0;i<dl.length;i++){if(i>0&&dl[i].points!==dl[i-1].points)rk=i+1;dl[i].rank=rk;}if(!dl.length){ct.innerHTML='<div class="es"><div style="font-size:2.5rem;margin-bottom:12px;opacity:.4">\uD83D\uDD0D</div><div style="font-size:.9rem">No players found</div></div>';return;}for(var i=0;i<dl.length;i++){var p=dl[i],row=document.createElement("div");row.className="player-row";row.tabIndex=0;row._pd=p;row.style.animationDelay=(i*.03)+"s";if(!searching&&p.rank===1)row.classList.add("top1");else if(!searching&&p.rank===2)row.classList.add("top2");else if(!searching&&p.rank===3)row.classList.add("top3");var rk2=p.rankings||{},fm2=gFM(),te=[];for(var k in rk2){if(rk2.hasOwnProperty(k)&&fm2.indexOf(k)!==-1){var res=bTB(k,rk2[k],fm2);if(res.h)te.push({h:res.h,p:res.p});}}te.sort(function(a,b){return b.p-a.p;});var th="";for(var j=0;j<te.length;j++)th+=te[j].h;var ti=gAT(p.points);row.innerHTML='<img class="avatar" src="https://mc-heads.net/body/'+p.uuid+'/100" loading="lazy" onerror="this.classList.add(\'avatar-error\')"><div class="player-info"><div class="name-line"><span class="rank">#'+p.rank+'</span><span class="player-name">'+esc(p.name)+'</span></div><span class="achievement '+ti.c+'">'+esc(ti.n)+'</span><div class="points">'+p.points+" pts</div></div>"+(th?'<div class="tiers-grid">'+th+"</div>":"");(function(pd,rn,pt){row.onclick=function(){oP(pd,rn,pt);};row.onkeydown=function(e){if(e.key==="Enter")oP(pd,rn,pt);};})(p,p.rank,p.points);frag.appendChild(row);}ct.appendChild(frag);}
function rTG(mode,players){var ct=document.getElementById("leaderboard"),tiers={1:[],2:[],3:[],4:[],5:[]};for(var i=0;i<players.length;i++){var p=players[i],r=p.rankings&&p.rankings[mode];if(!r||r.tier==null)continue;var tk=r.tier;if(!tiers[tk])tk=5;tiers[tk].push({name:p.name,uuid:p.uuid,rankings:p.rankings,pos:r.pos,ranking:r});}var frag=document.createDocumentFragment();var grid=document.createElement("div");grid.className="tier-grid";for(var t=1;t<=5;t++){var col=document.createElement("div");col.className="tier-column";col.dataset.tier=t;col.innerHTML='<div class="tier-title">Tier '+t+'</div><div class="tier-players"></div>';var pd=col.querySelector(".tier-players");if(tiers[t].length){tiers[t].sort(function(a,b){var aR=a.pos===2||a.pos===3?2:0,bR=b.pos===2||b.pos===3?2:0;if(aR!==bR)return aR-bR;return a.pos-b.pos;});for(var j=0;j<tiers[t].length;j++){var pl=tiers[t][j],div=document.createElement("div"),type=gPO(pl.pos)||"LT";div._pd=pl;div.className="player "+type;div.innerHTML='<img src="https://mc-heads.net/body/'+pl.uuid+'/100" loading="lazy" onerror="this.classList.add(\'avatar-error\')"><span class="pnc">'+esc(pl.name)+'</span>'+(hAP(pl.ranking)?'<span class="pps">\u2726</span>':"");(function(pd2,md){div.onclick=function(){var fn=gPF(),pts=fn({name:pd2.name,rankings:pd2.rankings});var ap=data.map(function(p){return{uuid:p.uuid,pts:fn(p)};}).filter(function(p){return p.pts>0;}).sort(function(a,b){return b.pts-a.pts;});var r=1;for(var i=0;i<ap.length;i++){if(i>0&&ap[i].pts!==ap[i-1].pts)r=i+1;if(ap[i].uuid===pd2.uuid)break;}oP({name:pd2.name,uuid:pd2.uuid,rankings:pd2.rankings},r,pts,gCL()+" \u2014 "+(ML[md]||md));};})(pl,mode);pd.appendChild(div);}}grid.appendChild(col);}frag.appendChild(grid);ct.appendChild(frag);}
function gBT1P(rk){if(!rk||rk.tier==null)return null;var h=false,bp=5;if(rk.tier===1){h=true;bp=rk.pos;}if(rk.peaked_tier!=null&&rk.peaked_pos!=null&&rk.peaked_tier===1){if(!h){h=true;bp=rk.peaked_pos;}else if(rk.peaked_pos<bp)bp=rk.peaked_pos;}return h?bp:null;}
function gBT1Class(pos){return pos===0?"ht1":pos===1?"lt1":pos===3?"rht1":pos===2?"rlt1":pos===5?"crht1":"crlt1";}
function gBT1Tag(pos){return pos===0?"HT1":pos===1?"LT1":pos===3?"RHT1":pos===2?"RLT1":pos===5?"CRHT1":"CRLT1";}
function rCT1(){var ct=document.getElementById("leaderboard"),frag=document.createDocumentFragment();var grid=document.createElement("div");grid.className="att-grid";for(var mi=0;mi<allM.length;mi++){var mode=allM[mi],gc=MC[mode]||"rgba(255,255,255,.3)";var br=document.createElement("div");br.className="att-bracket";br.style.animationDelay=(mi*.04)+"s";br.innerHTML='<div class="att-title" style="color:'+gc+'"><img src="'+IM[mode]+'" style="filter:drop-shadow(0 0 4px '+gc+')">'+esc(ML[mode]||mode)+'</div><div class="att-players"></div>';var pd=br.querySelector(".att-players");var ae=[];for(var pi=0;pi<data.length;pi++){var p=data[pi],rk=p.rankings&&p.rankings[mode];var pos=gBT1P(rk);if(pos===null)continue;ae.push({name:p.name,uuid:p.uuid,rankings:p.rankings,pos:pos});}if(ae.length){for(var j=0;j<ae.length;j++){var pl=ae[j],div=document.createElement("div");var cls=gBT1Class(pl.pos);div.className="att-player "+cls;div._pd={name:pl.name,uuid:pl.uuid,rankings:pl.rankings};var tag=gBT1Tag(pl.pos);div.innerHTML='<img src="https://mc-heads.net/body/'+pl.uuid+'/100" loading="lazy" onerror="this.classList.add(\'avatar-error\')"><span class="apn">'+esc(pl.name)+'</span><span class="att-tag">'+tag+'</span>';(function(pd2,md){div.onclick=function(){oP({name:pd2.name,uuid:pd2.uuid,rankings:pd2.rankings},0,gMP({name:pd2.name,rankings:pd2.rankings},allM),"Current Tier One's \u2014 "+(ML[md]||md));};})(pl,mode);pd.appendChild(div);}}else{pd.innerHTML='<div class="ae">No tier 1 yet</div>';}grid.appendChild(br);}frag.appendChild(grid);ct.appendChild(frag);}
function rCredits(){var ct=document.getElementById("leaderboard"),frag=document.createDocumentFragment();var w=document.createElement("div");w.className="cred-wrap";var cc=[{c:"oc",rc:"cr-ro",dc:"cdiv-ro"},{c:"dc",rc:"cr-dv",dc:"cdiv-dv"},{c:"rc",rc:"cr-rd",dc:"cdiv-rd"}];var ch="";for(var i=0;i<hof.length;i++){var e=hof[i],cfg=cc[i];ch+='<div class="cred-card '+cfg.c+'"><img class="ca" src="https://mc-heads.net/body/'+e.uuid+'/120" onerror="this.classList.add(\'avatar-error\')"><div class="cn">'+esc(e.name)+'</div><div class="cr '+cfg.rc+'">'+esc(e.role)+'</div><div class="cdiv '+cfg.dc+'"></div></div>';}w.innerHTML='<div class="cred-row">'+ch+'</div>';frag.appendChild(w);ct.appendChild(frag);}
function oP(p,rank,points,contextLabel){var mc=document.getElementById("mc"),fm=gFM(),ti=gAT(points),rk=p.rankings||{},se=[];for(var k in rk){if(rk.hasOwnProperty(k)&&fm.indexOf(k)!==-1)se.push([k,rk[k]]);}se.sort(function(a,b){return gPT(b[1])-gPT(a[1]);});var tr="",pc=0;for(var i=0;i<se.length;i++){var m=se[i][0],r=se[i][1];if(!r||r.tier==null||r.pos==null)continue;var ct2=gPO(r.pos);if(!ct2)continue;var cl=ct2+r.tier;var eh='<span class="et fc">'+esc(cl)+'</span>';if(r.peaked_tier!=null&&r.peaked_pos!=null){var pt=gPO(r.peaked_pos);if(pt){var pp=TP[pt+r.peaked_tier]||0,cp=TP[ct2+r.tier]||0;if(pp>cp){eh='<span class="ct">'+esc(cl)+'</span> <span class="arrow">\u2192</span> <span class="et fp">'+esc(pt+r.peaked_tier)+" \u2726</span>";pc++;}else if(pp===cp&&(r.peaked_tier!==r.tier||r.peaked_pos!==r.pos)){eh='<span class="et fp">'+esc(cl)+" \u2726</span>";pc++;}}}tr+='<div class="pcr"><img class="mi" src="'+IM[m]+'"><span class="ml">'+esc(ML[m]||m)+'</span>'+eh+'<span class="pts">'+gPT(r)+"pts</span></div>";}var ctxH="";if(contextLabel)ctxH='<div class="pctx">'+esc(contextLabel)+'</div>';var footer="";if(pc>0)footer='<div class="pdr"><div class="pdr-inner">\u2726 = points from peaked tier ('+pc+' mode'+(pc>1?"s":"")+')</div></div>';mc.innerHTML='<button class="close" id="modalCloseBtn" aria-label="Close">\u2715</button><img class="pa" src="https://mc-heads.net/body/'+p.uuid+'/100" onerror="this.classList.add(\'avatar-error\')"><div class="pn">'+esc(p.name)+'</div><div class="pr '+ti.c+'">'+esc(ti.n)+'</div><div class="ps">#'+rank+" \u2022 "+points+" points</div>"+ctxH+'<div class="ptl">Tier Breakdown</div>'+(tr?'<div style="text-align:left">'+tr+'</div>':'<div class="no-tiers-msg">No tiers yet</div>')+footer;document.getElementById("modal").classList.remove("hidden");document.getElementById("modalCloseBtn").addEventListener("click",function(e){e.stopPropagation();closeModal();});}
