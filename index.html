```html id="tiercolumns1"
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>

<style>
:root {
    --bg: #0b1220;
    --text: #e5e7eb;
    --accent: #f59e0b;
    --ht: #fb7185;
    --lt: #4ade80;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: var(--text);
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid #1f2937;
}

header h1 {
    color: var(--accent);
}

/* SEARCH */
.search-bar input {
    background: #020617;
    border: 1px solid #1f2937;
    padding: 10px;
    border-radius: 10px;
    color: white;
}

/* TABS */
.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px;
}

.tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: #020617;
    border: 1px solid #1f2937;
    border-radius: 10px;
    cursor: pointer;
}

.tab img {
    width: 16px;
}

.tab.active {
    background: var(--accent);
    color: black;
}

/* TIER GRID */
.tier-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    padding: 20px;
}

.tier-column {
    background: #0f172a;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 10px;
}

.tier-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
    color: var(--accent);
}

/* PLAYER CARD */
.player {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: #020617;
    font-size: 0.85rem;
}

.player img {
    width: 24px;
    border-radius: 4px;
}

.HT { border-left: 3px solid var(--ht); }
.LT { border-left: 3px solid var(--lt); }

.error {
    text-align: center;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>MMTiers</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
</header>

<div class="tabs" id="tabs"></div>

<div id="leaderboard"></div>

<script>

/* ICONS */
const iconMap = {
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"overall": "https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
};

const modes = ["overall","crystal","sword","uhc","smp","dsmp","netpot","dpot","cart","mace","axe"];

let leaderboardData = [];
let currentMode = "overall";

/* CREATE TABS */
function createTabs() {
    const tabsDiv = document.getElementById("tabs");
    modes.forEach(mode => {
        const btn = document.createElement("button");
        btn.className = "tab";
        if(mode === "overall") btn.classList.add("active");

        btn.innerHTML = `<img src="${iconMap[mode]}"> ${mode}`;
        btn.onclick = () => switchTab(mode, btn);

        tabsDiv.appendChild(btn);
    });
}

/* LOAD DATA */
async function loadLeaderboard() {
    const res = await fetch('api-1.json');
    leaderboardData = await res.json();
    renderLeaderboard();
}

function switchTab(mode, el) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderLeaderboard();
}

/* MAIN RENDER */
function renderLeaderboard(search="") {
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";

    let players = leaderboardData.filter(p =>
        p.name.toLowerCase().includes(search.toLowerCase())
    );

    /* CREATE TIER BUCKETS */
    const tiers = {
        1: [], 2: [], 3: [], 4: [], 5: []
    };

    players.forEach(p => {
        let data;

        if(currentMode === "overall") {
            // choose BEST tier across modes
            let best = null;

            Object.values(p.rankings || {}).forEach(r => {
                if(!best || r.tier < best.tier || (r.tier === best.tier && r.pos === 0)) {
                    best = r;
                }
            });

            if(!best) return;
            data = best;

        } else {
            data = p.rankings?.[currentMode];
            if(!data) return;
        }

        tiers[data.tier].push({
            name: p.name,
            uuid: p.uuid,
            pos: data.pos
        });
    });

    /* SORT EACH TIER (HT FIRST) */
    Object.values(tiers).forEach(arr => {
        arr.sort((a,b) => a.pos - b.pos);
    });

    /* BUILD GRID */
    const grid = document.createElement("div");
    grid.className = "tier-grid";

    for(let t = 1; t <= 5; t++) {
        const col = document.createElement("div");
        col.className = "tier-column";

        col.innerHTML = `<div class="tier-title">Tier ${t}</div>`;

        tiers[t].forEach(p => {
            const div = document.createElement("div");
            div.className = `player ${p.pos === 0 ? "HT" : "LT"}`;
            div.title = `${p.pos === 0 ? "High" : "Low"} Tier ${t}`;

            div.innerHTML = `
                <img src="https://mc-heads.net/avatar/${p.uuid}/100">
                ${p.name}
            `;

            col.appendChild(div);
        });

        grid.appendChild(col);
    }

    container.appendChild(grid);
}

document.getElementById("searchInput").addEventListener("input", e => {
    renderLeaderboard(e.target.value);
});

createTabs();
loadLeaderboard();

</script>

</body>
</html>
