<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers Leaderboard</title>

<style>
:root {
    --bg-color: #0c0c0c;
    --card-bg: #1a1a1a;
    --text-main: #ffffff;
    --ht-color: #ff4757;
    --lt-color: #2ed573;
    --point-color: #ffa502;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 20px;
}

.search-bar {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
}

.search-bar input {
    width: 300px;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 1rem;
    background: #222;
    color: #fff;
}

.player-row {
    display: grid;
    grid-template-columns: 60px 280px 150px 1fr;
    background: var(--card-bg);
    margin-bottom: 12px;
    padding: 20px 30px;
    border-radius: 12px;
    align-items: center;
    border: 1px solid #222;
    transition: transform 0.2s, box-shadow 0.2s;
}

.player-row:hover {
    transform: scale(1.02);
    box-shadow: 0 0 12px rgba(255,255,255,0.1);
}

.rank {
    font-weight: bold;
    color: #aaa;
    font-size: 1.5rem;
}

.player-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.avatar {
    width: 54px;
    height: 54px;
    image-rendering: pixelated;
    border-radius: 6px;
}

.player-name {
    font-size: 1.4rem;
    font-weight: 600;
}

.points {
    color: var(--point-color);
    font-weight: bold;
    font-size: 1.3rem;
}

.tiers-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    transition: transform 0.2s;
}

.tier-badge img {
    width: 22px;
    height: 22px;
    image-rendering: pixelated;
    object-fit: contain;
}

.HT {
    background: linear-gradient(135deg, rgba(255,71,87,0.2), rgba(255,71,87,0.05));
    color: var(--ht-color);
    border: 1px solid var(--ht-color);
}

.LT {
    background: linear-gradient(135deg, rgba(46,213,115,0.2), rgba(46,213,115,0.05));
    color: var(--lt-color);
    border: 1px solid var(--lt-color);
}

.error {
    color: #ff4757;
    text-align: center;
    margin-top: 50px;
}

@media (max-width: 800px) {
    .player-row {
        grid-template-columns: 50px 1fr 100px;
    }

    .tiers-list {
        margin-top: 10px;
        grid-column: span 3;
    }
}
</style>
</head>

<body>

<div class="container">
<h1>Overall Rankings</h1>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search player name...">
</div>

<div id="leaderboard">Loading rankings...</div>
</div>

<script>
const iconMap = {
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png?10e68"
};

const tierPoints = {
  "HT1": 60, "LT1": 45,
  "HT2": 35, "LT2": 25,
  "HT3": 15, "LT3": 6,
  "HT4": 4, "LT4": 3,
  "HT5": 2, "LT5": 1
};

let leaderboardData = [];

async function loadLeaderboard() {
    try {
        const response = await fetch('api-1.json');
        const data = await response.json();
        leaderboardData = data.map(player => {
            let totalPoints = 0;
            const rankings = player.rankings || {};
            Object.values(rankings).forEach(info => {
                const type = info.pos === 0 ? "HT" : "LT";
                const tierKey = type + info.tier;
                if (tierPoints[tierKey]) totalPoints += tierPoints[tierKey];
            });
            player.points = totalPoints;
            return player;
        });

        // Sort by total points (overall only)
        leaderboardData.sort((a,b) => b.points - a.points);
        renderLeaderboard();
    } catch(err) {
        document.getElementById("leaderboard").innerHTML =
        `<div class="error">Failed to load api-1.json</div>`;
    }
}

function renderLeaderboard(search = "") {
    const container = document.getElementById('leaderboard');
    container.innerHTML = "";

    const filtered = leaderboardData.filter(player =>
        player.name.toLowerCase().includes(search.toLowerCase())
    );

    if(filtered.length === 0) {
        container.innerHTML = `<div class="error">No players found.</div>`;
        return;
    }

    filtered.forEach((player,index) => {
        const row = document.createElement("div");
        row.className = "player-row";

        let tiersHTML = "";
        const rankings = player.rankings || {};
        Object.entries(rankings).forEach(([mode,info]) => {
            const type = info.pos === 0 ? "HT" : "LT";
            const icon = iconMap[mode.toLowerCase()] || "";
            tiersHTML += `<div class="tier-badge ${type}">
                <img src="${icon}">
                <span>${type}${info.tier}</span>
            </div>`;
        });

        row.innerHTML = `
        <div class="rank">#${index+1}</div>
        <div class="player-info">
            <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid}/100">
            <span class="player-name">${player.name}</span>
        </div>
        <div class="points">${player.points} Points</div>
        <div class="tiers-list">${tiersHTML}</div>
        `;
        container.appendChild(row);
    });
}

// Search functionality
document.getElementById('searchInput').addEventListener('input', e => {
    const search = e.target.value;
    renderLeaderboard(search);
});

loadLeaderboard();
</script>

</body>
</html>
