<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a10;--surface:#0c1017;--card:#0f1420;--card-hover:#141b28;--border:rgba(255,255,255,.045);--border-hover:rgba(255,255,255,.09);--text:#eef0f4;--text2:#7f8899;--text3:#454d5e;--accent:#f59e0b;--accent-dim:rgba(245,158,11,.08);--ht:#fb7185;--lt:#4ade80;--pk:#c084fc;--gold:#fbbf24;--silver:#94a3b8;--bronze:#d97706;--retired:#facc15;--ret-dim:rgba(250,204,21,.06);--r:11px;--rs:9px;--rx:7px;--tr:.22s cubic-bezier(.4,0,.2,1);--tr-s:.15s cubic-bezier(.4,0,.2,1)}
html{font-size:17.9px;scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
@keyframes fadeRow{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes stG{0%,100%{filter:drop-shadow(0 0 3px rgba(251,191,36,.4));transform:scale(1)}50%{filter:drop-shadow(0 0 6px rgba(251,191,36,.6));transform:scale(1.06)}}
@keyframes stGA{0%,100%{filter:drop-shadow(0 0 4px rgba(251,191,36,.6));transform:scale(1.03)}50%{filter:drop-shadow(0 0 9px rgba(251,191,36,.85));transform:scale(1.12)}}
@keyframes lgG{0%{background-position:0% 50%}100%{background-position:300% 50%}}

@keyframes msGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(251,191,36,.2)) drop-shadow(0 0 8px rgba(239,68,68,.2)) drop-shadow(0 0 8px rgba(251,146,60,.15))}50%{filter:drop-shadow(0 0 8px rgba(239,68,68,.4)) drop-shadow(0 0 12px rgba(251,146,60,.35)) drop-shadow(0 0 6px rgba(251,191,36,.25))}}
@keyframes mmG{0%,100%{filter:drop-shadow(0 0 5px rgba(34,211,238,.35)) drop-shadow(0 0 10px rgba(74,222,128,.25));background-position:0% 50%}50%{filter:drop-shadow(0 0 8px rgba(34,211,238,.55)) drop-shadow(0 0 16px rgba(74,222,128,.4));background-position:100% 50%}}

@keyframes rnG{0%,100%{filter:drop-shadow(0 0 5px rgba(248,113,113,.35)) drop-shadow(0 0 10px rgba(251,146,60,.25));background-position:0% 50%}50%{filter:drop-shadow(0 0 8px rgba(248,113,113,.55)) drop-shadow(0 0 16px rgba(251,146,60,.4));background-position:100% 50%}}
@keyframes foG{0%,100%{filter:drop-shadow(0 0 4px rgba(217,119,6,.2));background-position:0% 50%}50%{filter:drop-shadow(0 0 7px rgba(217,119,6,.4));background-position:100% 50%}}

@keyframes rBG{0%,100%{border-color:rgba(248,113,113,.3);box-shadow:0 0 8px rgba(248,113,113,.08),0 0 18px rgba(251,146,60,.05)}50%{border-color:rgba(251,146,60,.4);box-shadow:0 0 12px rgba(251,146,60,.15),0 0 28px rgba(248,113,113,.1)}}
@keyframes fBG{0%,100%{border-color:rgba(217,119,6,.2);box-shadow:0 0 6px rgba(217,119,6,.05)}50%{border-color:rgba(217,119,6,.35);box-shadow:0 0 10px rgba(217,119,6,.1)}}
@keyframes pp{0%,100%{opacity:.5}50%{opacity:1}}

@keyframes silverBorder{0%,100%{border-color:rgba(148,163,184,.1);box-shadow:0 0 5px rgba(148,163,184,.02),inset 0 1px 0 rgba(148,163,184,.03)}50%{border-color:rgba(148,163,184,.2);box-shadow:0 0 10px rgba(148,163,184,.06),inset 0 1px 0 rgba(148,163,184,.04)}}
@keyframes bronzeBorder{0%,100%{border-color:rgba(217,119,6,.1);box-shadow:0 0 5px rgba(217,119,6,.02),inset 0 1px 0 rgba(217,119,6,.03)}50%{border-color:rgba(217,119,6,.2);box-shadow:0 0 10px rgba(217,119,6,.06),inset 0 1px 0 rgba(217,119,6,.04)}}
@keyframes silverGlG{0%,100%{text-shadow:0 0 5px rgba(148,163,184,.3),0 0 10px rgba(148,163,184,.1)}50%{text-shadow:0 0 8px rgba(148,163,184,.5),0 0 14px rgba(148,163,184,.2)}}
@keyframes bronzeGlG{0%,100%{text-shadow:0 0 5px rgba(217,119,6,.3),0 0 10px rgba(217,119,6,.1)}50%{text-shadow:0 0 8px rgba(217,119,6,.5),0 0 14px rgba(217,119,6,.2)}}
@keyframes headerScan{0%{left:-30%}100%{left:130%}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 6px 1px rgba(192,132,252,.12)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes barGrow{from{width:0}}
@keyframes cpSlideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(40px,-30px) scale(1.1)}50%{transform:translate(-20px,20px) scale(.95)}75%{transform:translate(30px,10px) scale(1.05)}}
@keyframes lsGoldPulse{0%,100%{box-shadow:0 0 15px rgba(251,191,36,.08),0 0 30px rgba(251,191,36,.04)}50%{box-shadow:0 0 25px rgba(251,191,36,.18),0 0 50px rgba(251,191,36,.08)}}
@keyframes lsSilverPulse{0%,100%{box-shadow:0 0 12px rgba(148,163,184,.06),0 0 25px rgba(148,163,184,.03)}50%{box-shadow:0 0 20px rgba(148,163,184,.14),0 0 40px rgba(148,163,184,.06)}}
@keyframes lsBronzePulse{0%,100%{box-shadow:0 0 12px rgba(217,119,6,.06),0 0 25px rgba(217,119,6,.03)}50%{box-shadow:0 0 20px rgba(217,119,6,.14),0 0 40px rgba(217,119,6,.06)}}
@keyframes lsTextGlow{0%,100%{text-shadow:0 0 20px rgba(251,191,36,.4),0 0 40px rgba(251,191,36,.15),0 0 60px rgba(251,146,60,.08)}50%{text-shadow:0 0 30px rgba(251,191,36,.6),0 0 55px rgba(251,191,36,.25),0 0 80px rgba(251,146,60,.12)}}
@keyframes lsEnterGlow{0%,100%{box-shadow:0 0 20px rgba(251,191,36,.25),0 0 40px rgba(251,191,36,.08)}50%{box-shadow:0 0 30px rgba(251,191,36,.4),0 0 60px rgba(251,191,36,.15)}}
@keyframes lsParticle{0%{transform:translateY(0) scale(1);opacity:.6}100%{transform:translateY(-120vh) scale(0);opacity:0}}
@keyframes lsShimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}#bgCanvas{display:none}body::after{display:none}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:10px}
/* Loading Screen */
#loadingScreen{position:fixed;inset:0;z-index:9999;background:#050810;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .7s cubic-bezier(.4,0,.2,1),visibility .7s}
#loadingScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.ls-blob{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
.ls-blob-1{width:500px;height:500px;background:radial-gradient(circle,rgba(251,191,36,.35),transparent 70%);top:-150px;left:-120px;animation:blobFloat 12s ease-in-out infinite}
.ls-blob-2{width:420px;height:420px;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 70%);bottom:-120px;right:-100px;animation:blobFloat 14s ease-in-out infinite -4s}
.ls-blob-3{width:350px;height:350px;background:radial-gradient(circle,rgba(192,132,252,.25),transparent 70%);top:40%;left:60%;animation:blobFloat 10s ease-in-out infinite -7s}
.ls-blob-4{width:280px;height:280px;background:radial-gradient(circle,rgba(74,222,128,.2),transparent 70%);top:60%;left:15%;animation:blobFloat 11s ease-in-out infinite -2s}
.ls-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ls-particle{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;animation:lsParticle linear infinite}
.ls-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:20px}
.ls-logo{height:70px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(251,146,60,.6)) drop-shadow(0 0 30px rgba(251,191,36,.3));margin-bottom:12px}
.ls-title{font-size:2.8rem;font-weight:900;letter-spacing:.06em;color:#fbbf24;animation:lsTextGlow 3s ease-in-out infinite;margin-bottom:4px}
.ls-subtitle{font-size:.72rem;font-weight:700;letter-spacing:.2em;color:var(--text3);text-transform:uppercase;margin-bottom:36px}
.ls-divider{width:200px;height:1px;background:linear-gradient(90deg,transparent,rgba(251,191,36,.25),transparent);margin-bottom:24px}
.ls-top-label{font-size:.65rem;font-weight:800;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:18px}
.ls-top3{display:flex;gap:16px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.ls-pcard{display:flex;flex-direction:column;align-items:center;padding:22px 18px 18px;border-radius:16px;background:rgba(15,20,32,.85);border:1px solid;backdrop-filter:blur(12px);min-width:155px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.ls-pcard:hover{transform:translateY(-5px)}
.ls-pcard.gold{border-color:rgba(251,191,36,.25);animation:lsGoldPulse 3s ease-in-out infinite}
.ls-pcard.silver{border-color:rgba(148,163,184,.2);animation:lsSilverPulse 3.5s ease-in-out infinite}
.ls-pcard.bronze{border-color:rgba(217,119,6,.2);animation:lsBronzePulse 3.2s ease-in-out infinite}
.ls-pos{font-size:2rem;font-weight:900;line-height:1;margin-bottom:8px}
.ls-pos.gold-c{color:var(--gold);text-shadow:0 0 12px rgba(251,191,36,.4)}
.ls-pos.silver-c{color:var(--silver);text-shadow:0 0 10px rgba(148,163,184,.3)}
.ls-pos.bronze-c{color:var(--bronze);text-shadow:0 0 10px rgba(217,119,6,.3)}
.ls-avatar{width:52px;height:68px;border-radius:8px;object-fit:cover;object-position:center top;background:#0a0e14;box-shadow:0 4px 16px rgba(0,0,0,.4);margin-bottom:6px}
.ls-pname{font-size:.88rem;font-weight:800;margin-bottom:4px;text-align:center}
.ls-prank{font-size:.58rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-bottom:5px;white-space:nowrap}
.ls-prank.r-grandmaster{background:linear-gradient(90deg,#fff,#fb7185,#22d3ee,#ec4899,#06b6d4,#fff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 6s linear infinite,gmGlow 4s ease-in-out infinite}
.ls-prank.r-combatlegend{background:linear-gradient(90deg,#ffffff,#22c55e,#111111,#4ade80,#ffffff,#16a34a,#111111,#86efac,#ffffff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 5s linear infinite,clGlow 3.5s ease-in-out infinite}
.ls-prank.r-master{background:linear-gradient(90deg,#fbbf24,#ef4444,#fb923c,#f59e0b,#f87171,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 7s linear infinite,msGlow 4.5s ease-in-out infinite}
.ls-pts{font-size:.72rem;font-weight:700;color:var(--text2)}
.ls-enter{padding:15px 70px;font-size:1.1rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#070a10;background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);border:none;border-radius:14px;cursor:pointer;font-family:'Inter',sans-serif;position:relative;overflow:hidden;transition:all .35s cubic-bezier(.4,0,.2,1);animation:lsEnterGlow 2.5s ease-in-out infinite}
.ls-enter::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:lsShimmer 3s ease-in-out infinite;pointer-events:none}
.ls-enter:hover{transform:scale(1.06);box-shadow:0 0 40px rgba(251,191,36,.5),0 0 80px rgba(251,191,36,.2)}
.ls-enter:active{transform:scale(.98)}
/* Main App */
#mainApp{opacity:0;transition:opacity .5s .1s}
#mainApp.visible{opacity:1}
header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:rgba(7,10,16,.96);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid rgba(251,191,36,.04);overflow:hidden}
header::after{content:'';position:absolute;top:0;left:-30%;width:20%;height:100%;background:linear-gradient(90deg,transparent,rgba(251,191,36,.03),transparent);animation:headerScan 8s linear infinite;pointer-events:none}
.logo{height:46px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(251,146,60,.5)) drop-shadow(0 0 16px rgba(251,191,36,.25));transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;z-index:1}.logo:hover{transform:scale(1.05);filter:drop-shadow(0 0 12px rgba(251,146,60,.7)) drop-shadow(0 0 24px rgba(251,191,36,.4))}
.header-right{display:flex;align-items:center;gap:5px;position:relative;z-index:1}
.hbtn{display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--surface);border:1px solid rgba(251,191,36,.05);border-radius:var(--rx);color:var(--text3);font-size:.72rem;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;position:relative;overflow:hidden}
.hbtn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(251,191,36,.08),transparent 60%);opacity:0;transition:opacity .3s}
.hbtn:hover::before{opacity:1}.hbtn:hover{color:var(--accent);border-color:rgba(251,191,36,.15)}
.cmp-btn{border-color:rgba(192,132,252,.1);color:rgba(192,132,252,.45)}
.cmp-btn::before{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(192,132,252,.08),transparent 60%)}
.cmp-btn:hover{border-color:rgba(192,132,252,.28);color:#c084fc}
.cmp-btn.active{background:rgba(192,132,252,.07);border-color:rgba(192,132,252,.4);color:#c084fc;box-shadow:0 0 0 1px rgba(192,132,252,.3),0 0 12px rgba(192,132,252,.08);animation:badgePulse 2s ease-in-out infinite}
.discord-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(0,0,0,.3);border:1px solid rgba(88,101,242,.2);border-radius:var(--rx);color:rgba(88,101,242,.6);font-size:.72rem;font-weight:700;text-decoration:none;transition:var(--tr);position:relative;overflow:hidden}
.discord-btn:hover{border-color:rgba(88,101,242,.45);color:#5865f2;transform:translateY(-1px)}
.discord-btn svg{width:14px;height:14px;fill:currentColor}
.tiktok-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;background:linear-gradient(135deg,rgba(236,72,153,.03),rgba(34,211,238,.03));border:1px solid rgba(236,72,153,.18);border-radius:var(--rx);color:rgba(236,72,153,.55);font-size:.72rem;font-weight:700;text-decoration:none;transition:var(--tr);position:relative;overflow:hidden}
.tiktok-btn:hover{border-color:rgba(34,211,238,.4);color:#22d3ee;transform:translateY(-1px)}
.tiktok-btn svg{width:13px;height:13px;fill:currentColor}
.search-bar{position:relative}
.search-bar::before{content:"\1F50D";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.72rem;pointer-events:none;opacity:.3}
.search-bar input{background:var(--surface);border:1px solid var(--border);padding:7px 10px 7px 30px;border-radius:var(--rx);color:var(--text);font-family:inherit;font-size:.78rem;width:170px;outline:none;transition:var(--tr)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar input:focus{border-color:rgba(245,158,11,.3);box-shadow:0 0 0 2px var(--accent-dim),0 0 16px rgba(245,158,11,.05)}
.tabs-wrapper{position:sticky;top:66px;z-index:90;background:rgba(7,10,16,.85);backdrop-filter:blur(16px) saturate(1.1);padding:8px 20px 0;border-bottom:1px solid rgba(255,255,255,.02)}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:5px;padding:6px 13px;background:transparent;border:1px solid transparent;border-radius:var(--rx);cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;white-space:nowrap;transition:var(--tr);letter-spacing:.01em;position:relative;overflow:hidden}
.tab-emoji{font-size:.88rem;position:relative;z-index:1}.tab-text{position:relative;z-index:1}
.tab:hover{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.04)}
.tab-separator{width:1px;background:rgba(255,255,255,.04);margin:0 1px;flex-shrink:0;align-self:stretch}
.tab[data-mode="halloffame"]{color:rgba(251,191,36,.35)}.tab[data-mode="halloffame"].active{color:#fbbf24;border-color:rgba(251,191,36,.45);box-shadow:0 0 0 1px rgba(251,191,36,.4),0 0 12px rgba(251,191,36,.12),inset 0 1px 0 rgba(251,191,36,.08);text-shadow:0 0 8px rgba(251,191,36,.35);background:rgba(251,191,36,.04)}
.tab[data-mode="maintiers"]{color:rgba(34,211,238,.3)}.tab[data-mode="maintiers"].active{color:#22d3ee;border-color:rgba(34,211,238,.45);box-shadow:0 0 0 1px rgba(34,211,238,.4),0 0 12px rgba(34,211,238,.1),inset 0 1px 0 rgba(34,211,238,.06);text-shadow:0 0 8px rgba(34,211,238,.3);background:rgba(34,211,238,.04)}
.tab[data-mode="subtiers"]{color:rgba(192,132,252,.3)}.tab[data-mode="subtiers"].active{color:#c084fc;border-color:rgba(192,132,252,.45);box-shadow:0 0 0 1px rgba(192,132,252,.4),0 0 12px rgba(192,132,252,.1),inset 0 1px 0 rgba(192,132,252,.06);text-shadow:0 0 8px rgba(192,132,252,.3);background:rgba(192,132,252,.04)}
.sub-tabs-wrapper{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .25s,padding .3s;padding:0 20px}
.sub-tabs-wrapper.visible{max-height:65px;opacity:1;padding:7px 20px 10px}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{display:flex;align-items:center;height:44px;padding:0 9px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:9px;cursor:pointer;color:var(--text3);font-family:inherit;white-space:nowrap;transition:var(--tr);flex-shrink:0;overflow:hidden;position:relative}
.sub-tab:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06);transform:translateY(-1px)}

/* ========== STATE ========== */
var state={tab:'maintiers',mode:'o',view:'leaderboard',cmpOn:false,cmpPicks:[],search:''};

/* ========== HELPERS ========== */
function getRank(p){return RANKS.find(function(r){return r.id===p.r;})||RANKS[RANKS.length-1];}
function getRankName(p){return getRank(p).name;}
function avatarUrl(p){return'https://i.pravatar.cc/60?img='+p.a;}
function avatarUrlLg(p){return'https://i.pravatar.cc/150?img='+p.a;}
function isRetired(tier){return tier&&tier.s==='RHT'||tier&&tier.s==='RLT';}
function tierKey(tier){return tier.s+tier.t;}
function tierPts(tier){return TIER_PTS[tierKey(tier)]||0;}
function sortPlayers(list,modeId,tierType){
  return list.slice().sort(function(a,b){
    var ta=tierType==='main'?a.mt[modeId]:a.st[modeId];
    var tb=tierType==='main'?b.mt[modeId]:b.st[modeId];
    if(!ta&&!tb)return b.pts-a.pts;
    if(!ta)return 1;if(!tb)return -1;
    var oa=ta.s==='HT'?0:ta.s==='RHT'?1:ta.s==='LT'?2:3;
    var ob=tb.s==='HT'?0:tb.s==='RHT'?1:tb.s==='LT'?2:3;
    if(oa!==ob)return oa-ob;
    if(ta.t!==tb.t)return ta.t-tb.t;
    return b.pts-a.pts;
  });
}
function filterSearch(list){
  if(!state.search)return list;
  var q=state.search.toLowerCase();
  return list.filter(function(p){return p.n.toLowerCase().indexOf(q)!==-1;});
}

/* ========== LOADING SCREEN ========== */

    dot.className='ls-particle';

  }

    container.appendChild(card);
  });
  $('lsEnter').addEventListener('click',function(){

    $('mainApp').classList.add('visible');
    setTimeout(function(){$('loadingScreen').style.display='none';},700);
  });

/* ========== TABS ========== */
function renderTabs(){
  var el=$('tabs');
  el.innerHTML='';
  TABS.forEach(function(tab){
    if(tab.id==='_sep'){
      var sep=document.createElement('div');
      sep.className='tab-separator';
      el.appendChild(sep);
      return;
    }
    var btn=document.createElement('button');
    btn.className='tab'+(state.tab===tab.id?' active':'');
    btn.setAttribute('data-mode',tab.id);
    btn.innerHTML='<span class="tab-emoji">'+tab.emoji+'</span><span class="tab-text">'+tab.text+'</span>';
    btn.addEventListener('click',function(){switchTab(tab.id);});
    el.appendChild(btn);
  });
}

function switchTab(id){
  state.tab=id;
  state.mode='o';
  state.view='leaderboard';
  state.cmpPicks=[];
  if(state.cmpOn)toggleCompare();
  renderTabs();
  renderSubTabs();
  renderContent();
}

/* ========== SUB TABS ========== */
function renderSubTabs(){
  var wrap=$('subTabsWrapper');
  var el=$('subTabs');
  if(state.tab==='halloffame'){wrap.classList.remove('visible');return;}
  wrap.classList.add('visible');
  el.innerHTML='';
  var modes=state.tab==='maintiers'?MODES_MAIN:MODES_SUB;
  modes.forEach(function(m){
    var btn=document.createElement('button');
    btn.className='sub-tab'+(state.mode===m.id?' active':'');
    var iconHtml='';
    if(m.star){
      iconHtml='<span class="sub-tab-star">\u{2B50}</span>';
    }else{
      iconHtml='<div class="sub-tab-icon"><img src="'+modeIcon(m)+'" alt="'+esc(m.name)+'"></div>';
    }
    btn.innerHTML=iconHtml+'<span class="sub-tab-label">'+esc(m.name)+'</span>';
    btn.addEventListener('click',function(){state.mode=m.id;renderSubTabs();renderContent();});
    el.appendChild(btn);
  });
}

/* ========== CONTENT ========== */
function renderContent(){
  var el=$('leaderboard');
  el.classList.add('fade-out');
  setTimeout(function(){
    if(state.tab==='halloffame'){renderHOF(el);}
    else{renderTierTab(el);}
    el.classList.remove('fade-out');
  },120);
}

function renderTierTab(el){
  var modes=state.tab==='maintiers'?MODES_MAIN:MODES_SUB;
  var tierType=state.tab==='maintiers'?'main':'sub';
  var m=modes.find(function(x){return x.id===state.mode;});
  // View toggle
  var html='<div class="view-toggle">';
  html+='<button class="vt-btn'+(state.view==='leaderboard'?' active':'')+'" data-v="leaderboard">Leaderboard</button>';
  html+='<button class="vt-btn'+(state.view==='tierlist'?' active':'')+'" data-v="tierlist">Tier List</button>';
  html+='</div>';
  if(state.view==='leaderboard'){
    var sorted=sortPlayers(PLAYERS,state.mode,tierType);
    sorted=filterSearch(sorted);
    if(!sorted.length){html+='<div class="te"><div class="ti">\u{1F50D}</div><div class="tt">No players found</div><div class="td">Try adjusting your search query.</div></div>';}
    else{
      sorted.forEach(function(p,i){
        html+=renderPlayerRow(p,i,tierType);
      });
    }
  }else{
    html+=renderTierGrid(tierType);
  }
  el.innerHTML=html;
  // Bind view toggle
  el.querySelectorAll('.vt-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      state.view=btn.getAttribute('data-v');
      renderContent();
    });
  });
  // Bind player clicks
  bindPlayerClicks(el,tierType);
  // Bind tooltips
  bindTooltips(el,tierType);
}

function renderPlayerRow(p,idx,tierType){
  var modes=state.tab==='maintiers'?MODES_MAIN:MODES_SUB;
  var tiers=tierType==='main'?p.mt:p.st;
  var rank=getRank(p);
  var topClass=idx===0?' top1':idx===1?' top2':idx===2?' top3':'';
  var cmpClass=state.cmpOn?'':'';
  var cmpPicked=state.cmpPicks.indexOf(p)!==-1?' cmp-picked':'';
  var html='<div class="player-row'+topClass+cmpClass+'" data-idx="'+PLAYERS.indexOf(p)+'">';
  if(state.cmpOn){html+='<div class="cmp-sel">'+(cmpPicked?'\u2713':'')+'</div>';}
  html+='<img class="avatar" src="'+avatarUrl(p)+'" alt="'+esc(p.n)+'" onerror="this.classList.add(\'avatar-error\')">';
  html+='<div class="player-info"><div class="name-line"><span class="rank">#'+(idx+1)+'</span><span class="player-name">'+esc(p.n)+'</span><span class="achievement '+rank.id+'">'+esc(rank.name)+'</span></div>';
  html+='<div class="points">'+p.pts.toLocaleString()+' pts</div></div>';
  html+='<div class="tiers-grid">';
  modes.forEach(function(m){
    var t=tiers[m.id];
    if(!t)return;
    var peaked=t.p?' has-peaked':'';
    html+='<div class="tier-badge '+t.s+peaked+'" data-m="'+m.id+'" data-p="'+PLAYERS.indexOf(p)+'">';
    html+='<img src="'+TIER_ICONS[t.s]+'" alt="'+t.s+'">';
    html+='<span class="tb-label">'+t.s+'</span>';
    if(t.p)html+='<span class="tb-peak">PEAKED</span>';
    html+='</div>';
  });
  html+='</div></div>';
  return html;
}

function renderTierGrid(tierType){
  var modes=state.tab==='maintiers'?MODES_MAIN:MODES_SUB;
  var m=modes.find(function(x){return x.id===state.mode;});
  var cols=[];
  for(var i=1;i<=5;i++)cols.push({tier:i,players:[]});
  PLAYERS.forEach(function(p){
    var tiers=tierType==='main'?p.mt:p.st;
    var t=tiers[state.mode];
    if(!t)return;
    if(isRetired(t))return; // Filter out retired tiers
    if(t.t>=1&&t.t<=5){
      cols[t.t-1].players.push({player:p,tier:t});
    }
  });
  var html='<div class="tier-grid">';
  cols.forEach(function(col){
    html+='<div class="tier-column" data-tier="'+col.tier+'">';
    html+='<div class="tier-title">Tier '+col.tier+'</div>';
    html+='<div class="tier-players">';
    if(!col.players.length){
      html+='<div class="ae">No players</div>';
    }else{
      col.players.forEach(function(entry){
        var p=entry.player;
        var t=entry.tier;
        html+='<div class="player '+t.s+'" data-idx="'+PLAYERS.indexOf(p)+'">';
        html+='<img src="'+avatarUrl(p)+'" alt="'+esc(p.n)+'" onerror="this.classList.add(\'avatar-error\')">';
        html+='<span class="pnc">'+esc(p.n)+'</span>';
        if(t.p)html+='<span class="pps">PEAKED</span>';
        html+='</div>';
      });
    }
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

/* ========== COMPARE ========== */
function toggleCompare(){
  state.cmpOn=!state.cmpOn;
  state.cmpPicks=[];
  var btn=$('cmpToggle');
  if(state.cmpOn){
    btn.classList.add('active');
    document.body.classList.add('compare-active');
  }else{
    btn.classList.remove('active');
    document.body.classList.remove('compare-active');
    $('cpPanel').classList.remove('vis');
  }
  renderContent();
}

function initCompare(){
  $('cmpToggle').addEventListener('click',toggleCompare);
  $('cpClose').addEventListener('click',function(){
    $('cpPanel').classList.remove('vis');
  });
}

function handleCompareClick(p){
  var idx=state.cmpPicks.indexOf(p);
  if(idx!==-1){state.cmpPicks.splice(idx,1);renderContent();updateComparePanel();return;}
  if(state.cmpPicks.length>=2){state.cmpPicks.shift();}
  state.cmpPicks.push(p);
  renderContent();
  updateComparePanel();
}

function updateComparePanel(){
  var panel=$('cpPanel');
  if(state.cmpPicks.length<2){panel.classList.remove('vis');return;}
  var p1=state.cmpPicks[0],p2=state.cmpPicks[1];
  var modes=state.tab==='maintiers'?MODES_MAIN:MODES_SUB;
  var tierType=state.tab==='maintiers'?'main':'sub';
  var t1=tierType==='main'?p1.mt:p1.st;
  var t2=tierType==='main'?p2.mt:p2.st;
  // Head
  var hh='<div class="cp-p'+(p1.pts>=p2.pts?' cp-w':'')+'"><img src="'+avatarUrl(p1)+'" alt="'+esc(p1.n)+'"><span>'+esc(p1.n)+'</span><span class="cp-pts">'+p1.pts+' pts</span></div>';
  hh+='<div class="cp-vs">VS</div>';
  hh+='<div class="cp-p'+(p2.pts>=p1.pts?' cp-w':'')+'"><img src="'+avatarUrl(p2)+'" alt="'+esc(p2.n)+'"><span>'+esc(p2.n)+'</span><span class="cp-pts">'+p2.pts+' pts</span></div>';
  $('cpHead').innerHTML=hh;
  // Modes
  var mh='';
  var tie=false;
  modes.forEach(function(m){
    var a=t1[m.id],b=t2[m.id];
    var aP=a?tierPts(a):0,bP=b?tierPts(b):0;
    var w=aP>bP?1:aP<bP?2:0;
    if(w===0)tie=true;
    var maxP=Math.max(aP,bP,1);
    mh+='<div class="cp-row'+(w===0?' cp-tie':'')+'">';
    mh+='<div class="cp-ml">';
    if(m.star)mh+='<span class="sub-tab-star" style="font-size:14px">\u{2B50}</span>';
    else mh+='<img src="'+modeIcon(m)+'" alt="">';
    mh+='<span>'+esc(m.name)+'</span></div>';
    mh+='<div class="cp-bars">';
    // Player 1 bar
    var w1p=Math.max((aP/maxP)*100,0);
    var barColor1=w===1?'linear-gradient(90deg,#fbbf24,#f59e0b)':'rgba(255,255,255,0.08)';
    mh+='<div class="cp-bw'+(w===1?' cp-win':'')+'"><div class="cp-bf" style="width:'+w1p+'%;background:'+barColor1+';color:'+(w===1?'rgba(0,0,0,.8)':'var(--text3)')+'">'+(a?(a.s+' T'+a.t):'--')+'</div></div>';
    // Player 2 bar
    var w2p=Math.max((bP/maxP)*100,0);
    var barColor2=w===2?'linear-gradient(90deg,#fbbf24,#f59e0b)':'rgba(255,255,255,0.08)';
    mh+='<div class="cp-bw'+(w===2?' cp-win':'')+'"><div class="cp-bf" style="width:'+w2p+'%;background:'+barColor2+';color:'+(w===2?'rgba(0,0,0,.8)':'var(--text3)')+'">'+(b?(b.s+' T'+b.t):'--')+'</div></div>';
    mh+='</div></div>';
  });
  $('cpModes').innerHTML=mh;
  panel.classList.add('vis');
}

/* ========== SEARCH ========== */
function initSearch(){
  var input=$('searchInput');
  var timer;
  input.addEventListener('input',function(){
    clearTimeout(timer);
    timer=setTimeout(function(){
      state.search=input.value.trim();
      renderContent();
    },200);
  });
}

/* ========== TOOLTIPS ========== */
function bindTooltips(el,tierType){
  var badges=el.querySelectorAll('.tier-badge');
  badges.forEach(function(badge){
    badge.addEventListener('mouseenter',function(e){
      var mi=badge.getAttribute('data-m');
      var pi=parseInt(badge.getAttribute('data-p'));
      var p=PLAYERS[pi];
      if(!p)return;
      var modes=state.tab==='maintiers'?MODES_MAIN:MODES_SUB;
      var m=modes.find(function(x){return x.id===mi;});
      if(!m)return;
      var tiers=tierType==='main'?p.mt:p.st;
      var t=tiers[mi];
      if(!t)return;
      var btt=$('btt');
      var bttI=$('bttI');
      var isTop=e.clientY<window.innerHeight/2;
      bttI.className='btt-i';
      var h='<div class="btt-m">';
      if(m.star)h+='<span class="sub-tab-star" style="font-size:14px">\u{2B50}</span>';
      else h+='<img class="btt-mi" src="'+modeIcon(m)+'" alt="">';
      h+='<span class="btt-ml">'+esc(m.name)+'</span></div>';
      h+='<div class="btt-t '+t.s.toLowerCase()+'">'+t.s+' \u2014 Tier '+t.t+'</div>';
      if(t.p){h+='<div class="btt-peak"><div class="btt-peak-label">Status</div><div class="btt-peak-val">PEAKED</div></div>';}
      h+='<div class="btt-pts">'+tierPts(t)+' points</div>';
      h+='<div class="btt-a'+(isTop?' top':'')+'"></div>';
      bttI.innerHTML=h;
      btt.style.left=Math.min(e.clientX+12,window.innerWidth-180)+'px';
      if(isTop){btt.style.top=(e.clientY+12)+'px';btt.style.bottom='auto';}
      else{btt.style.bottom=(window.innerHeight-e.clientY+12)+'px';btt.style.top='auto';}
      btt.classList.add('visible');
    });
    badge.addEventListener('mouseleave',function(){
      $('btt').classList.remove('visible');
    });
  });
}

/* ========== PLAYER CLICKS ========== */
function bindPlayerClicks(el,tierType){
  var rows=el.querySelectorAll('.player-row');
  rows.forEach(function(row){
    row.addEventListener('click',function(){
      var idx=parseInt(row.getAttribute('data-idx'));
      var p=PLAYERS[idx];
      if(!p)return;
      if(state.cmpOn){handleCompareClick(p);return;}
      openPlayerModal(p);
    });
  });
  var gridPlayers=el.querySelectorAll('.tier-grid .player');
  gridPlayers.forEach(function(gp){
    gp.addEventListener('click',function(){
      var idx=parseInt(gp.getAttribute('data-idx'));
      var p=PLAYERS[idx];
      if(!p)return;
      openPlayerModal(p);
    });
  });
}

/* ========== BACKGROUND ========== */
function initBg(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=$('bgCanvas');
  var ctx=c.getContext('2d');
  var w,h,particles=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
  function create(){
    particles=[];
    for(var i=0;i<50;i++){
      particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+0.4,dx:(Math.random()-0.5)*0.25,dy:(Math.random()-0.5)*0.25,o:Math.random()*0.2+0.04});
    }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(0.1,p.r),0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+p.o+')';
      ctx.fill();
      p.x+=p.dx;p.y+=p.dy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;
      if(p.y<0)p.y=h;if(p.y>h)p.y=0;
    }
    requestAnimationFrame(draw);
  }
  resize();create();draw();
  window.addEventListener('resize',function(){resize();create();});
}

/* ========== MODAL CLOSE ON BACKDROP ========== */
function initModalClose(){
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();});
  $('infoModal').addEventListener('click',function(e){if(e.target===$('infoModal'))$('infoModal').classList.add('hidden');});
}

/* ========== HOVER RADIAL FOR HEADER BTNS ========== */
function initHoverRadial(){
  document.querySelectorAll('.hbtn').forEach(function(btn){
    btn.addEventListener('mousemove',function(e){
      var r=btn.getBoundingClientRect();
      btn.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      btn.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    });
  });
}

/* ========== INIT ========== */
function init(){
  initLoading();
  initBg();
  renderTabs();
  renderSubTabs();
  renderContent();
  initInfoModal();
  initCompare();
  initSearch();
  initModalClose();
  initHoverRadial();
}

document.addEventListener('DOMContentLoaded',init);
</script>
