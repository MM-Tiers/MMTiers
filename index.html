<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 900px; margin: auto; }

        .player-row {
            display: grid;
            grid-template-columns: 50px 250px 120px 1fr;
            background: var(--card-bg);
            margin-bottom: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            align-items: center;
            border: 1px solid #333;
        }

        .rank { font-weight: bold; color: #555; font-size: 1.1rem; }
        
        .player-info { display: flex; align-items: center; gap: 15px; }
        
        /* THE CHANGE: Larger, better-looking skin render */
        .avatar { 
            width: 48px; 
            height: 48px; 
            border-radius: 8px; 
            background: #2a2a2a;
            object-fit: contain;
        }

        .points { color: var(--point-color); font-weight: bold; }

        /* Custom Icon Styling */
        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 900;
            margin-right: 8px;
            margin-bottom: 5px;
        }
        
        .mode-icon-img {
            width: 18px;
            height: 18px;
            image-rendering: pixelated; /* Keeps Minecraft icons sharp */
        }

        .HT { background: rgba(255, 71, 87, 0.1); color: var(--ht-color); border: 1px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.1); color: var(--lt-color); border: 1px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom: 30px;">Overall Rankings</h1>
    <div id="leaderboard">Loading...</div>
</div>

<script>
    /** * ICON CONFIGURATION: 
     * Replace these URLs with the actual icons you want to use.
     * You can upload your own icons to your GitHub repo and use the links here.
     */
    const iconMap = {
        "vanilla": "https://minecraft.wiki/images/Sword_Inv_Sprite.png",
        "sword": "https://minecraft.wiki/images/Sword_Inv_Sprite.png",
        "axe": "https://minecraft.wiki/images/Axe_Inv_Sprite.png",
        "crystal": "https://minecraft.wiki/images/End_Crystal_Inv_Sprite.png",
        "uhc": "https://minecraft.wiki/images/Golden_Apple_Inv_Sprite.png"
    };

    function createTierBadge(modeName, data) {
        const type = (data.pos === 0) ? 'HT' : 'LT';
        const iconUrl = iconMap[modeName.toLowerCase()] || ""; 
        
        const iconHtml = iconUrl ? `<img src="${iconUrl}" class="mode-icon-img">` : "";
        
        return `
            <span class="tier-badge ${type}">
                ${iconHtml}
                ${type}${data.tier}
            </span>`;
    }

    async function loadLeaderboard() {
        const board = document.getElementById('leaderboard');
        try {
            const response = await fetch('api-1.json'); 
            if (!response.ok) throw new Error("File 'api-1.json' not found");
            
            const players = await response.json();
            players.sort((a, b) => b.points - a.points);

            board.innerHTML = players.map((p, i) => `
                <div class="player-row">
                    <div class="rank">#${i + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/bust/${p.uuid}/100">
                        <strong>${p.name}</strong>
                    </div>
                    <div class="points">${p.points} PTS</div>
                    <div class="tiers-list">
                        ${Object.entries(p.rankings).map(([mode, data]) => createTierBadge(mode, data)).join('')}
                    </div>
                </div>
            `).join('');

        } catch (err) {
            board.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
    }

    loadLeaderboard();
</script>
</body>
</html>
