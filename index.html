<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html { zoom: 1.25; }

:root {
  --bg:#0b1220;
  --text:#ffffff;
  --accent:#f59e0b;
  --ht:#fb7185;
  --lt:#4ade80;
}

body {
  margin:0;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:var(--text);
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  border-bottom:1px solid #1f2937;
}

.logo {
  height:50px; /* adjust as needed */
  object-fit:contain;
}

.search-bar input {
  background:#020617;
  border:1px solid #1f2937;
  padding:10px;
  border-radius:10px;
  color:white;
}

.search-bar input::placeholder { color: #cbd5e1; }

.tabs {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:15px;
}

.tab {
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#020617;
  border:1px solid #1f2937;
  border-radius:10px;
  cursor:pointer;
  color: white;
  font-weight:700;
  transition:0.2s;
}

.tab img { width:16px; }

.tab.active {
  background:var(--accent);
  color:white;
}

.tab:hover {
  transform:scale(1.05);
}

#leaderboard { transition:opacity 0.25s ease; }
.fade-out { opacity:0; }

.player-row {
  display:grid;
  grid-template-columns:50px 1fr 1fr;
  padding:14px;
  margin:10px;
  background:linear-gradient(145deg,#020617,#0f172a);
  border-radius:14px;
  border:1px solid #1f2937;
  cursor:pointer;
  color:white;
}

.rank { color:var(--accent); font-weight:bold; }

.player-info { display:flex; align-items:center; gap:10px; }

.avatar { width:36px; border-radius:6px; }

/* NEW TEXT */
.player-text { display:flex; flex-direction:column; }

.name-line { display:flex; align-items:center; gap:8px; }

.player-name { font-weight:700; }

.achievement {
  font-size:0.7rem;
  padding:2px 8px;
  border-radius:10px;
  background:rgba(245,158,11,0.15);
  color:var(--accent);
}

.points { font-size:0.8rem; color:#cbd5e1; }

.tiers-list {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tier-badge {
  display:flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border-radius:6px;
  font-size:0.75rem;
  color: inherit;
  animation: pulse 1.5s infinite alternate;
}

.tier-badge img { width:14px; }

.HT { background:rgba(251,113,133,0.15); color:var(--ht); }
.LT { background:rgba(74,222,128,0.15); color:var(--lt); }

@keyframes pulse {
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.05); filter: brightness(1.3); }
  100% { transform: scale(1); filter: brightness(1); }
}

/* TOP 3 */
.top1, .top2, .top3 {
  transform:scale(1.02);
  position:relative;
}

.top1 {
  border:1px solid gold;
  box-shadow:0 0 20px rgba(255,215,0,0.4);
}

.top2 {
  border:1px solid #c0c0c0;
  box-shadow:0 0 15px rgba(192,192,192,0.4);
}

.top3 {
  border:1px solid #cd7f32;
  box-shadow:0 0 15px rgba(205,127,50,0.4);
}

.top1::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, transparent, rgba(255,215,0,0.3), transparent);
  animation:shine 2s infinite;
}

@keyframes shine {
  0% { transform:translateX(-100%); }
  100% { transform:translateX(100%); }
}

.tier-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  padding:10px;
}

.tier-column {
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:10px;
  padding:10px;
}

.tier-title { text-align:center; font-weight:bold; margin-bottom:8px; color:var(--accent); }

.player {
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px;
  margin-bottom:5px;
  border-radius:6px;
  background:#020617;
  font-size:0.8rem;
  cursor:pointer;
}

.player img { width:22px; border-radius:4px; }

.player.HT { border-left:3px solid var(--ht); }
.player.LT { border-left:3px solid var(--lt); }

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
}

.hidden { opacity:0; pointer-events:none; }

.modal-content {
  background:#020617;
  border:1px solid #1f2937;
  border-radius:20px;
  padding:25px;
  width:300px;
  text-align:center;
  position:relative;
}

.close { position:absolute; top:10px; right:15px; cursor:pointer; }

.profile-avatar { width:90px; border-radius:50%; border:3px solid var(--accent); }
.profile-name { font-size:1.4rem; margin:10px 0; }
.profile-rank {
  background:rgba(245,158,11,0.2);
  color:var(--accent);
  padding:6px 12px;
  border-radius:20px;
  display:inline-block;
}

@media(max-width:768px){
  .tier-grid { grid-template-columns:repeat(2,1fr); }
  .player-row { grid-template-columns:40px 1fr; }
}
</style>

</head>

<body>

<header>
  <img src="https://i.imgur.com/Lxk7JHf.png" alt="MMTiers Logo" class="logo">
  <div class="search-bar">
    <input id="searchInput" placeholder="Search player...">
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard">Loading...</div>

<div id="modal" class="modal hidden">
<div class="modal-content" id="modalContent"></div>
</div>

<script>
const iconMap={
overall:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png",
crystal:"https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
sword:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
uhc:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
smp:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
dsmp:"https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
netpot:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
dpot:"https://static.wikia.nocookie.net/pvplegacy/images/0/0e/PotionDuels.png",
cart:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Minecart_with_TNT_JE2_BE2.png",
mace:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
axe:"https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png"
};

const modes=["overall","crystal","sword","uhc","smp","dsmp","netpot","dpot","cart","mace","axe"];
const tierPoints={HT1:60,LT1:45,HT2:35,LT2:25,HT3:15,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};

let data=[];
let currentMode="overall";

init();

async function init(){
  createTabs();
  await loadData();
  render();
}

async function loadData(){
  const res=await fetch("api-1.json");
  data=await res.json();
}

function createTabs(){
  const tabs=document.getElementById("tabs");
  modes.forEach(m=>{
    const btn=document.createElement("button");
    btn.className="tab";
    if(m==="overall") btn.classList.add("active");
    btn.innerHTML=`<img src="${iconMap[m]}">${m}`;
    btn.onclick=()=>switchTab(m,btn);
    tabs.appendChild(btn);
  });
}

function switchTab(mode,btn){
  const container=document.getElementById("leaderboard");
  container.classList.add("fade-out");
  setTimeout(()=>{
    currentMode=mode;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    render();
    container.classList.remove("fade-out");
  },200);
}

function getPoints(p){
  let pts=0;
  Object.values(p.rankings||{}).forEach(r=>{
    const type=r.pos===0?"HT":"LT";
    pts+=tierPoints[type+r.tier]||0;
  });
  return pts;
}

function getAchievementTitle(points){
  if(points>=400) return "Combat Grandmaster";
  if(points>=250) return "Combat Master";
  if(points>=100) return "Combat Ace";
  if(points>=50) return "Combat Specialist";
  if(points>=20) return "Combat Cadet";
  if(points>=10) return "Combat Novice";
  return "Rookie";
}

function computeRanks(players){
  players.sort((a,b)=>b.points - a.points);
  let rank = 1;
  let lastPoints = null;
  let skip = 0;

  players.forEach((p)=>{
    if(lastPoints !== p.points){
      rank = rank + skip;
      skip = 1;
      p.rank = rank;
      lastPoints = p.points;
    } else {
      p.rank = rank;
      skip++;
    }
  });

  return players;
}

function openProfile(p, rank=0, points=0){
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");

  let tiers = "";
  Object.entries(p.rankings || {}).forEach(([m, r]) => {
    const type = r.pos===0?"HT":"LT";
    tiers += `<div class="tier-badge ${type}"><img src="${iconMap[m]}">${type}${r.tier}</div>`;
  });

  content.innerHTML = `
    <div class="close" onclick="closeModal()">✖</div>
    <img class="profile-avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">
    <div class="profile-name">${p.name}</div>
    <div class="profile-rank">${getAchievementTitle(points)}</div>
    <div style="margin-top:10px;">#${rank} • ${points} pts</div>
    <div class="tiers-list">${tiers}</div>
  `;

  modal.classList.remove("hidden");
}

function closeModal(){ document.getElementById("modal").classList.add("hidden"); }

function render(){
  const container=document.getElementById("leaderboard");
  const search=document.getElementById("searchInput").value.toLowerCase();

  let players=data.filter(p=>p.name.toLowerCase().includes(search));
  container.innerHTML="";

  if(currentMode==="overall"){
    players = players.map(p=>({...p, points:getPoints(p)}));
    players = computeRanks(players);

    players.forEach((p)=>{
      const row = document.createElement("div");
      row.className="player-row";

      if(p.rank===1) row.classList.add("top1");
      if(p.rank===2) row.classList.add("top2");
      if(p.rank===3) row.classList.add("top3");

      let tiersHTML="";
      Object.entries(p.rankings||{}).forEach(([m,r])=>{
        const type = r.pos===0?"HT":"LT";
        tiersHTML+=`<div class="tier-badge ${type}"><img src="${iconMap[m]}">${type}${r.tier}</div>`;
      });

      row.innerHTML=`
        <div class="rank">
          ${p.rank===1?"👑":p.rank===2?"🥈":p.rank===3?"🥉":"#"+p.rank}
        </div>

        <div class="player-info">
          <img class="avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">
          <div class="player-text">
            <div class="name-line">
              <span class="player-name">${p.name}</span>
              <span class="achievement">${getAchievementTitle(p.points)}</span>
            </div>
            <div class="points">${p.points} pts</div>
          </div>
        </div>

        <div class="tiers-list">${tiersHTML}</div>
      `;

      row.onclick = ()=>openProfile(p, p.rank, p.points);
      container.appendChild(row);
    });
    return;
  }

  const tiers={1:[],2:[],3:[],4:[],5:[]};
  players.forEach(p=>{
    const r=p.rankings?.[currentMode];
    if(!r) return;
    tiers[r.tier].push({...p,pos:r.pos});
  });

  const grid=document.createElement("div");
  grid.className="tier-grid";

  for(let t=1;t<=5;t++){
    const col=document.createElement("div");
    col.className="tier-column";
    col.innerHTML=`<div class="tier-title">Tier ${t}</div>`;
    tiers[t].sort((a,b)=>a.pos-b.pos);
    tiers[t].forEach(p=>{
      const div=document.createElement("div");
      div.className=`player ${p.pos===0?"HT":"LT"}`;
      div.innerHTML=`<img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}`;
      div.onclick=()=>openProfile(p,getPoints(p));
      col.appendChild(div);
    });
    grid.appendChild(col);
  }

  container.appendChild(grid);
}

document.getElementById("searchInput").addEventListener("input",render);
</script>

</body>
</html>
