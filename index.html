<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCTiers Leaderboard</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .leaderboard-container { max-width: 900px; margin: auto; }
        
        .player-card {
            display: grid;
            grid-template-columns: 50px 250px 100px 1fr;
            background: #1a1a1a;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
            align-items: center;
            border: 1px solid #333;
        }

        .avatar { width: 40px; border-radius: 5px; margin-right: 12px; vertical-align: middle; }
        
        /* Tier Styles */
        .tier {
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 0.8rem;
            margin-right: 8px;
            text-transform: uppercase;
        }
        .HT { background: #ff4757; color: white; box-shadow: 0 0 10px rgba(255, 71, 87, 0.3); }
        .LT { background: #2ed573; color: white; }
        
        .points { color: #ffa502; font-weight: bold; }
        .error-msg { color: #ff4757; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="leaderboard-container">
    <h1>Overall Rankings</h1>
    <div id="leaderboard">Loading rankings...</div>
</div>

<script>
    // Converts API tier/pos to HT/LT display
    function getTierLabel(tier, pos) {
        const type = (pos === 0) ? 'HT' : 'LT';
        return `<span class="tier ${type}">${type}${tier}</span>`;
    }

    async function loadStats() {
        const board = document.getElementById('leaderboard');
        try {
            const response = await fetch('players.json');
            if (!response.ok) throw new Error("Could not find players.json");
            
            const data = await response.json();
            
            board.innerHTML = data.map((player, i) => `
                <div class="player-card">
                    <div style="font-weight: bold; color: #666;">#${i + 1}</div>
                    <div>
                        <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid}/64">
                        <strong>${player.name}</strong>
                    </div>
                    <div class="points">${player.points} PTS</div>
                    <div>
                        ${Object.values(player.rankings).map(r => getTierLabel(r.tier, r.pos)).join('')}
                    </div>
                </div>
            `).join('');

        } catch (err) {
            board.innerHTML = `<div class="error-msg">Error: Make sure players.json exists in the same folder!</div>`;
            console.error(err);
        }
    }

    loadStats();
</script>
</body>
</html>
