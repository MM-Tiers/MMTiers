<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>
<style>
:root {
    --bg: #0b1220;
    --text: #e5e7eb;
    --accent: #f59e0b;
    --ht: #fb7185;
    --lt: #4ade80;
    --card-bg: #111827;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: var(--text);
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    border-bottom: 1px solid #1f2937;
    background: rgba(11,18,32,0.85);
    backdrop-filter: blur(6px);
}

header h1 {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
}

/* SEARCH */
.search-bar input {
    background: rgba(2,6,23,0.7);
    border: 1px solid #1f2937;
    padding: 0.5rem 1rem;
    border-radius: 12px;
    color: var(--text);
    outline: none;
    transition: 0.2s;
}

.search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(245,158,11,0.5);
}

/* TABS */
.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 1rem 2rem;
}

.tab {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: rgba(2,6,23,0.7);
    border-radius: 12px;
    border: 1px solid #1f2937;
    cursor: pointer;
    font-weight: 500;
    transition: 0.2s;
}

.tab.active {
    background: var(--accent);
    color: #111827;
    font-weight: 600;
}

/* LEADERBOARD */
.player-row {
    display: grid;
    grid-template-columns: 60px 1.5fr 1fr 2fr;
    padding: 1rem;
    margin: 0.75rem 2rem;
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid #1f2937;
    transition: 0.3s;
}

.player-row:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
}

.rank {
    color: var(--accent);
    font-weight: bold;
}

.player-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
}

/* TIER BADGES */
.tiers-list {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.tier-badge {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
    transition: 0.2s;
}

.HT {
    background: rgba(251,113,133,0.15);
    color: var(--ht);
}

.LT {
    background: rgba(74,222,128,0.15);
    color: var(--lt);
}

/* PLAYER TABS */
.player {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    margin-bottom: 0.5rem;
    border-radius: 12px;
    background: rgba(2,6,23,0.7);
    font-size: 0.85rem;
    border-left: 3px solid transparent;
    transition: 0.2s;
}

.player.HT {
    border-left-color: var(--ht);
    box-shadow: 0 0 6px rgba(251,113,133,0.3);
}

.player.LT {
    border-left-color: var(--lt);
    box-shadow: 0 0 6px rgba(74,222,128,0.3);
}

/* TIER GRID */
.tier-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
    padding: 1rem 2rem;
}

.tier-column {
    background: var(--card-bg);
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 0.5rem;
}

.tier-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 0.5rem;
    color: var(--accent);
}
</style>
</head>
<body>

<header>
    <h1>MMTiers</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard"></div>

<script>
// ICONS & MODES
const iconMap = {
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"overall": "https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
};
const modes = ["overall","crystal","sword","uhc","smp","dsmp","netpot","dpot","cart","mace","axe"];
const tierPoints = { "HT1":60,"LT1":45,"HT2":35,"LT2":25,"HT3":15,"LT3":6,"HT4":4,"LT4":3,"HT5":2,"LT5":1};

let leaderboardData = [];
let currentMode = "overall";

// CREATE TABS
const tabsDiv = document.getElementById("tabs");
modes.forEach(mode => {
    const btn = document.createElement("button");
    btn.className = "tab";
    if(mode==="overall") btn.classList.add("active");
    btn.innerHTML = `<img src="${iconMap[mode]}" width="16"> ${mode}`;
    btn.onclick = ()=>{currentMode=mode;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderLeaderboard();};
    tabsDiv.appendChild(btn);
});

// LOAD DATA
async function loadLeaderboard() {
    const res = await fetch('api-1.json');
    leaderboardData = await res.json();
    renderLeaderboard();
}

// RENDER
function renderLeaderboard(search=""){
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";
    let players = leaderboardData.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

    if(currentMode==="overall"){
        players = players.map(p=>{
            let pts=0;
            Object.values(p.rankings||{}).forEach(r=>{
                const type=r.pos===0?"HT":"LT";
                pts+=tierPoints[type+r.tier]||0;
            });
            return {...p, points:pts};
        }).sort((a,b)=>b.points-a.points);

        players.forEach((p,i)=>{
            let tiersHTML="";
            Object.entries(p.rankings||{}).forEach(([mode,info])=>{
                const type = info.pos===0?"HT":"LT";
                tiersHTML+=`<div class="tier-badge ${type}" title="${mode} ${type}${info.tier}"><img src="${iconMap[mode]}" width="16">${type}${info.tier}</div>`;
            });
            const row = document.createElement("div");
            row.className="player-row";
            row.innerHTML=`
            <div class="rank">#${i+1}</div>
            <div class="player-info"><img class="avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}</div>
            <div>${p.points} pts</div>
            <div class="tiers-list">${tiersHTML}</div>`;
            container.appendChild(row);
        });
        return;
    }

    // MODE COLUMNS
    const tiers={1:[],2:[],3:[],4:[],5:[]};
    players.forEach(p=>{
        const data=p.rankings?.[currentMode];
        if(!data) return;
        tiers[data.tier].push({name:p.name, uuid:p.uuid, pos:data.pos});
    });
    Object.values(tiers).forEach(arr=>arr.sort((a,b)=>a.pos-b.pos));
    const grid=document.createElement("div");
    grid.className="tier-grid";
    for(let t=1;t<=5;t++){
        const col=document.createElement("div");
        col.className="tier-column";
        col.innerHTML=`<div class="tier-title">Tier ${t}</div>`;
        tiers[t].forEach(p=>{
            const div=document.createElement("div");
            div.className=`player ${p.pos===0?"HT":"LT"}`;
            div.innerHTML=`<img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}`;
            col.appendChild(div);
        });
        grid.appendChild(col);
    }
    container.appendChild(grid);
}

document.getElementById("searchInput").addEventListener("input", e=>renderLeaderboard(e.target.value));
loadLeaderboard();
</script>

</body>
</html>
