<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 60px;
        }

        .container { max-width: 1200px; margin: auto; }

        h1 { font-size: 3rem; margin-bottom: 40px; }

        .player-row {
            display: grid;
            grid-template-columns: 80px 350px 180px 1fr;
            background: var(--card-bg);
            margin-bottom: 15px;
            padding: 30px; /* Bigger padding */
            border-radius: 15px;
            align-items: center;
            border: 1px solid #222;
        }

        .rank { font-weight: bold; color: #444; font-size: 2rem; }
        
        .player-info { display: flex; align-items: center; gap: 25px; }
        
        /* 4x Bigger Avatar */
        .avatar { 
            width: 80px; 
            height: 80px; 
            image-rendering: pixelated; 
            border-radius: 8px;
        }

        .player-name { font-size: 1.8rem; font-weight: 700; }

        .points { color: var(--point-color); font-weight: bold; font-size: 1.6rem; }

        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 1.2rem; /* Bigger Tier Text */
            font-weight: 900;
        }
        
        /* Fixed Squishing and Made 4x Bigger */
        .mode-icon-img {
            width: 42px; /* Large icons */
            height: 42px;
            image-rendering: pixelated;
            object-fit: contain; /* Prevents squishing */
        }

        .HT { background: rgba(255, 71, 87, 0.15); color: var(--ht-color); border: 2px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.15); color: var(--lt-color); border: 2px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Overall Rankings</h1>
    <div id="leaderboard">Loading...</div>
</div>

<script>
    const iconMap = {
        "crystal": "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png",
        "sword": "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png",
        "mace": "https://minecraft.wiki/images/Mace_JE1_BE1.png",
        "smp": "https://minecraft.wiki/images/Ender_Pearl_JE3_BE2.png",
        "dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
        "dsmp": "https://minecraft.wiki/images/Cobweb_JE2_BE2.png",
        "netpot": "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png",
        "uhc": "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png",
        "axe": "https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png"
    };

    async function loadLeaderboard() {
        try {
            const response = await fetch('api-1.json');
            const data = await response.json();
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            data.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                let tiersHTML = '';
                for (const [mode, info] of Object.entries(player.tiers || {})) {
                    const type = (info.pos === 0) ? 'HT' : 'LT';
                    const icon = iconMap[mode.toLowerCase()] || "";
                    tiersHTML += `
                        <div class="tier-badge ${type}">
                            <img src="${icon}" class="mode-icon-img" referrerpolicy="no-referrer">
                            <span>${type}${info.tier}</span>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid || 'steve'}/100" alt="head">
                        <span class="player-name">${player.name}</span>
                    </div>
                    <div class="points">${player.points} Points</div>
                    <div class="tiers-list">${tiersHTML}</div>
                `;
                container.appendChild(row);
            });
        } catch (err) {
            document.getElementById('leaderboard').innerHTML = `<div class="error">Error loading data.</div>`;
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
