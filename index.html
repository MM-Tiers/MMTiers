<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 900px; margin: auto; }

        .player-row {
            display: grid;
            grid-template-columns: 50px 250px 120px 1fr;
            background: var(--card-bg);
            margin-bottom: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            align-items: center;
            border: 1px solid #333;
        }

        .rank { font-weight: bold; color: #888; font-size: 1.1rem; }
        
        .player-info { display: flex; align-items: center; gap: 15px; }
        
        .avatar { 
            width: 40px; 
            height: 40px; 
            image-rendering: pixelated; 
            border-radius: 4px;
        }

        .points { color: var(--point-color); font-weight: bold; }

        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 900;
        }
        
        .mode-icon-img {
            width: 18px;
            height: 18px;
            image-rendering: pixelated;
        }

        .HT { background: rgba(255, 71, 87, 0.1); color: var(--ht-color); border: 1px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.1); color: var(--lt-color); border: 1px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom: 30px;">Overall Rankings</h1>
    <div id="leaderboard">Loading rankings...</div>
</div>

<script>
    // These links use direct paths to ensure they show up on your site
    const iconMap = {
        "crystal": "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png",
        "sword": "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png",
        "mace": "https://minecraft.wiki/images/Mace_JE1_BE1.png",
        "smp": "https://minecraft.wiki/images/Ender_Pearl_JE3_BE2.png",
        "dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
        "dsmp": "https://minecraft.wiki/images/Cobweb_JE2_BE2.png",
        "netpot": "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png",
        "uhc": "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png",
        "axe": "https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png"
    };

    async function loadLeaderboard() {
        try {
            // Fetching your local JSON file
            const response = await fetch('api-1.json');
            if (!response.ok) throw new Error("Could not load API data");
            const data = await response.json();

            const container = document.getElementById('leaderboard');
            container.innerHTML = ''; // Clear "Loading" text

            // Assuming your JSON is an array of players
            data.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                // Create Tiers HTML
                let tiersHTML = '';
                for (const [mode, info] of Object.entries(player.tiers || {})) {
                    const type = (info.pos === 0) ? 'HT' : 'LT';
                    const icon = iconMap[mode.toLowerCase()] || "";
                    tiersHTML += `
                        <div class="tier-badge ${type}">
                            <img src="${icon}" class="mode-icon-img" referrerpolicy="no-referrer">
                            <span>${type}${info.tier}</span>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid || 'steve'}/40" alt="head">
                        <span style="font-weight: 500;">${player.name}</span>
                    </div>
                    <div class="points">${player.points} pts</div>
                    <div class="tiers-list">${tiersHTML}</div>
                `;
                container.appendChild(row);
            });

        } catch (err) {
            document.getElementById('leaderboard').innerHTML = `<div class="error">Failed to load leaderboard data.</div>`;
            console.error(err);
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
