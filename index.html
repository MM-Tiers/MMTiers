<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>

<style>
:root {
    --bg: #0b1220;
    --text: #e5e7eb;
    --accent: #f59e0b;
    --ht: #fb7185;
    --lt: #4ade80;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: var(--text);
    transition: background 0.3s;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid #1f2937;
}

header h1 {
    background: linear-gradient(90deg, #f59e0b, #fb7185, #4ade80);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    font-size: 2rem;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}

/* SEARCH */
.search-bar input {
    background: #020617;
    border: 1px solid #1f2937;
    padding: 10px;
    border-radius: 10px;
    color: white;
}

/* TABS */
.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px;
}

.tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: #020617;
    border: 1px solid #1f2937;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
}

.tab img {
    width: 16px;
}

.tab.active {
    background: var(--accent);
    color: #020617;
    transform: scale(1.05);
}

/* LEADERBOARD CONTAINER TRANSITION */
#leaderboard {
    transition: opacity 0.4s ease;
    opacity: 1;
}

/* OVERALL ROW */
.player-row {
    display: grid;
    grid-template-columns: 60px 250px 150px 1fr;
    padding: 18px;
    margin: 12px 20px;
    background: linear-gradient(145deg, #020617, #0f172a);
    border-radius: 16px;
    border: 1px solid #1f2937;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.player-row:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

/* TIERS */
.tiers-list {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.tier-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 0.8rem;
    transition: all 0.3s ease;
    cursor: default;
}

/* Glow animation */
.tier-badge.HT:hover {
    box-shadow: 0 0 10px rgba(251,113,133,0.7);
    transform: scale(1.05);
}

.tier-badge.LT:hover {
    box-shadow: 0 0 10px rgba(74,222,128,0.7);
    transform: scale(1.05);
}

.HT {
    background: rgba(251,113,133,0.15);
    color: var(--ht);
}

.LT {
    background: rgba(74,222,128,0.15);
    color: var(--lt);
}

/* TIER TITLE MODERN */
.tier-title {
    text-align: center;
    font-weight: 600;
    margin-bottom: 10px;
    color: #fbbf24;
    font-size: 1.1rem;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

/* TIER GRID */
.tier-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    padding: 20px;
}

.tier-column {
    background: #0f172a;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 10px;
}

/* PLAYER (MODE TABS) */
.player {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: #020617;
    font-size: 0.85rem;
    border-left: 3px solid transparent;
    transition: all 0.3s ease;
}

.player.HT {
    border-left: 3px solid var(--ht);
    box-shadow: 0 0 6px rgba(251,113,133,0.4);
}

.player.LT {
    border-left: 3px solid var(--lt);
    box-shadow: 0 0 6px rgba(74,222,128,0.4);
}

.player img {
    width: 24px;
    border-radius: 4px;
}
</style>
</head>

<body>

<header>
    <h1>MMTiers</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard"></div>

<script>
/* ICONS */
const iconMap = {
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"overall": "https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
};

const modes = ["overall","crystal","sword","uhc","smp","dsmp","netpot","dpot","cart","mace","axe"];

const tierPoints = {
  "HT1": 60, "LT1": 45,
  "HT2": 35, "LT2": 25,
  "HT3": 15, "LT3": 6,
  "HT4": 4, "LT4": 3,
  "HT5": 2, "LT5": 1
};

let leaderboardData = [];
let currentMode = "overall";

/* CREATE TABS */
function createTabs() {
    const tabsDiv = document.getElementById("tabs");
    modes.forEach(mode => {
        const btn = document.createElement("button");
        btn.className = "tab";
        if(mode === "overall") btn.classList.add("active");

        btn.innerHTML = `<img src="${iconMap[mode]}"> ${mode}`;
        btn.onclick = () => switchTab(mode, btn);

        tabsDiv.appendChild(btn);
    });
}

/* LOAD DATA */
async function loadLeaderboard() {
    const res = await fetch('api-1.json');
    leaderboardData = await res.json();
    renderLeaderboard();
}

/* SWITCH TAB (with fade, but keep overall tab as is) */
function switchTab(mode, el) {
    const container = document.getElementById("leaderboard");
    
    if(mode === "overall") {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderLeaderboard();
        return;
    }

    container.style.opacity = 0;
    setTimeout(() => {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderLeaderboard();
        container.style.opacity = 1;
    }, 300);
}

/* RENDER */
function renderLeaderboard(search="") {
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";

    let players = leaderboardData.filter(p =>
        p.name.toLowerCase().includes(search.toLowerCase())
    );

    /* OVERALL */
    if(currentMode === "overall") {
        players = players.map(p => {
            let pts = 0;
            Object.values(p.rankings || {}).forEach(r => {
                const type = r.pos === 0 ? "HT" : "LT";
                pts += tierPoints[type + r.tier] || 0;
            });
            return {...p, points: pts};
        });

        players.sort((a,b) => b.points - a.points);

        players.forEach((p,i) => {
            const row = document.createElement("div");
            row.className = "player-row";

            let tiersHTML = "";
            Object.entries(p.rankings || {}).forEach(([mode,info]) => {
                const type = info.pos === 0 ? "HT" : "LT";

                tiersHTML += `
                <div class="tier-badge ${type}" title="${mode.charAt(0).toUpperCase() + mode.slice(1)} ${type}${info.tier}">
                    <img src="${iconMap[mode]}">
                    ${type}${info.tier}
                </div>`;
            });

            row.innerHTML = `
            <div class="rank">#${i+1}</div>
            <div class="player-info">
                <img class="avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">
                ${p.name}
            </div>
            <div>${p.points} pts</div>
            <div class="tiers-list">${tiersHTML}</div>
            `;

            container.appendChild(row);
        });

        return;
    }

    /* TIER COLUMNS */
    const tiers = {1:[],2:[],3:[],4:[],5:[]};

    players.forEach(p => {
        const data = p.rankings?.[currentMode];
        if(!data) return;

        tiers[data.tier].push({
            name: p.name,
            uuid: p.uuid,
            pos: data.pos
        });
    });

    Object.values(tiers).forEach(arr => {
        arr.sort((a,b) => a.pos - b.pos);
    });

    const grid = document.createElement("div");
    grid.className = "tier-grid";

    for(let t=1;t<=5;t++) {
        const col = document.createElement("div");
        col.className = "tier-column";
        col.innerHTML = `<div class="tier-title">Tier ${t}</div>`;

        tiers[t].forEach(p => {
            const div = document.createElement("div");
            div.className = `player ${p.pos === 0 ? "HT" : "LT"}`;

            div.innerHTML = `
                <img src="https://mc-heads.net/avatar/${p.uuid}/100">
                ${p.name}
            `;

            col.appendChild(div);
        });

        grid.appendChild(col);
    }

    container.appendChild(grid);
}

document.getElementById("searchInput").addEventListener("input", e => {
    renderLeaderboard(e.target.value);
});

createTabs();
loadLeaderboard();
</script>

</body>
</html>
