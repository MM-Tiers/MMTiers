<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a10;--surface:#0c1017;--card:#0f1420;--card-hover:#141b28;--border:rgba(255,255,255,.045);--border-hover:rgba(255,255,255,.09);--text:#eef0f4;--text2:#7f8899;--text3:#454d5e;--accent:#f59e0b;--accent-dim:rgba(245,158,11,.08);--ht:#fb7185;--lt:#4ade80;--pk:#c084fc;--gold:#fbbf24;--silver:#94a3b8;--bronze:#d97706;--retired:#facc15;--ret-dim:rgba(250,204,21,.06);--r:11px;--rs:9px;--rx:7px;--tr:.22s cubic-bezier(.4,0,.2,1);--tr-s:.15s cubic-bezier(.4,0,.2,1)}
html{font-size:17.9px;scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
@keyframes fadeRow{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes stG{0%,100%{filter:drop-shadow(0 0 3px rgba(251,191,36,.4));transform:scale(1)}50%{filter:drop-shadow(0 0 6px rgba(251,191,36,.6));transform:scale(1.06)}}
@keyframes stGA{0%,100%{filter:drop-shadow(0 0 4px rgba(251,191,36,.6));transform:scale(1.03)}50%{filter:drop-shadow(0 0 9px rgba(251,191,36,.85));transform:scale(1.12)}}
@keyframes lgG{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes gmGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,255,255,.2)) drop-shadow(0 0 8px rgba(251,113,133,.25)) drop-shadow(0 0 8px rgba(34,211,238,.18))}50%{filter:drop-shadow(0 0 8px rgba(251,113,133,.45)) drop-shadow(0 0 12px rgba(34,211,238,.35)) drop-shadow(0 0 6px rgba(255,255,255,.25))}}
@keyframes msGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(251,191,36,.2)) drop-shadow(0 0 8px rgba(239,68,68,.2)) drop-shadow(0 0 8px rgba(251,146,60,.15))}50%{filter:drop-shadow(0 0 8px rgba(239,68,68,.4)) drop-shadow(0 0 12px rgba(251,146,60,.35)) drop-shadow(0 0 6px rgba(251,191,36,.25))}}
@keyframes mmG{0%,100%{filter:drop-shadow(0 0 5px rgba(34,211,238,.35)) drop-shadow(0 0 10px rgba(74,222,128,.25));background-position:0% 50%}50%{filter:drop-shadow(0 0 8px rgba(34,211,238,.55)) drop-shadow(0 0 16px rgba(74,222,128,.4));background-position:100% 50%}}
@keyframes dvG{0%,100%{filter:drop-shadow(0 0 5px rgba(168,85,247,.35)) drop-shadow(0 0 10px rgba(236,72,153,.25));background-position:0% 50%}50%{filter:drop-shadow(0 0 8px rgba(168,85,247,.55)) drop-shadow(0 0 16px rgba(236,72,153,.4));background-position:100% 50%}}
@keyframes rnG{0%,100%{filter:drop-shadow(0 0 5px rgba(248,113,113,.35)) drop-shadow(0 0 10px rgba(251,146,60,.25));background-position:0% 50%}50%{filter:drop-shadow(0 0 8px rgba(248,113,113,.55)) drop-shadow(0 0 16px rgba(251,146,60,.4));background-position:100% 50%}}
@keyframes oBG{0%,100%{border-color:rgba(34,211,238,.3);box-shadow:0 0 8px rgba(34,211,238,.08),0 0 18px rgba(74,222,128,.05)}50%{border-color:rgba(74,222,128,.4);box-shadow:0 0 12px rgba(74,222,128,.15),0 0 28px rgba(34,211,238,.1)}}
@keyframes dBG{0%,100%{border-color:rgba(168,85,247,.3);box-shadow:0 0 8px rgba(168,85,247,.08),0 0 18px rgba(236,72,153,.05)}50%{border-color:rgba(236,72,153,.4);box-shadow:0 0 12px rgba(236,72,153,.15),0 0 28px rgba(168,85,247,.1)}}
@keyframes rBG{0%,100%{border-color:rgba(248,113,113,.3);box-shadow:0 0 8px rgba(248,113,113,.08),0 0 18px rgba(251,146,60,.05)}50%{border-color:rgba(251,146,60,.4);box-shadow:0 0 12px rgba(251,146,60,.15),0 0 28px rgba(248,113,113,.1)}}
@keyframes pp{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes legBorder{0%,100%{border-color:rgba(251,191,36,.12);box-shadow:0 0 6px rgba(251,191,36,.03),inset 0 1px 0 rgba(251,191,36,.04)}50%{border-color:rgba(251,191,36,.22);box-shadow:0 0 12px rgba(251,191,36,.06),inset 0 1px 0 rgba(251,191,36,.06)}}
@keyframes glG{0%,100%{text-shadow:0 0 5px rgba(251,191,36,.4),0 0 10px rgba(251,191,36,.15)}50%{text-shadow:0 0 8px rgba(251,191,36,.6),0 0 14px rgba(251,191,36,.25)}}
@keyframes goldBorder{0%,100%{border-color:rgba(251,191,36,.12);box-shadow:0 0 6px rgba(251,191,36,.03),inset 0 1px 0 rgba(251,191,36,.04)}50%{border-color:rgba(251,191,36,.25);box-shadow:0 0 14px rgba(251,191,36,.08),inset 0 1px 0 rgba(251,191,36,.06)}}
@keyframes silverBorder{0%,100%{border-color:rgba(148,163,184,.1);box-shadow:0 0 5px rgba(148,163,184,.02),inset 0 1px 0 rgba(148,163,184,.03)}50%{border-color:rgba(148,163,184,.2);box-shadow:0 0 10px rgba(148,163,184,.06),inset 0 1px 0 rgba(148,163,184,.04)}}
@keyframes bronzeBorder{0%,100%{border-color:rgba(217,119,6,.1);box-shadow:0 0 5px rgba(217,119,6,.02),inset 0 1px 0 rgba(217,119,6,.03)}50%{border-color:rgba(217,119,6,.2);box-shadow:0 0 10px rgba(217,119,6,.06),inset 0 1px 0 rgba(217,119,6,.04)}}
@keyframes silverGlG{0%,100%{text-shadow:0 0 5px rgba(148,163,184,.3),0 0 10px rgba(148,163,184,.1)}50%{text-shadow:0 0 8px rgba(148,163,184,.5),0 0 14px rgba(148,163,184,.2)}}
@keyframes bronzeGlG{0%,100%{text-shadow:0 0 5px rgba(217,119,6,.3),0 0 10px rgba(217,119,6,.1)}50%{text-shadow:0 0 8px rgba(217,119,6,.5),0 0 14px rgba(217,119,6,.2)}}
@keyframes headerScan{0%{left:-30%}100%{left:130%}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 6px 1px rgba(192,132,252,.12)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes barGrow{from{width:0}}
@keyframes cpSlideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}#bgCanvas{display:none}body::after{display:none}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:10px}
header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:rgba(7,10,16,.96);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid rgba(251,191,36,.04);overflow:hidden}
header::after{content:'';position:absolute;top:0;left:-30%;width:20%;height:100%;background:linear-gradient(90deg,transparent,rgba(251,191,36,.03),transparent);animation:headerScan 8s linear infinite;pointer-events:none}
.logo{height:46px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(251,146,60,.5)) drop-shadow(0 0 16px rgba(251,191,36,.25));transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;z-index:1}.logo:hover{transform:scale(1.05);filter:drop-shadow(0 0 12px rgba(251,146,60,.7)) drop-shadow(0 0 24px rgba(251,191,36,.4))}
.header-right{display:flex;align-items:center;gap:5px;position:relative;z-index:1}
.hbtn{display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--surface);border:1px solid rgba(251,191,36,.05);border-radius:var(--rx);color:var(--text3);font-size:.72rem;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;position:relative;overflow:hidden}
.hbtn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(251,191,36,.08),transparent 60%);opacity:0;transition:opacity .3s}
.hbtn:hover::before{opacity:1}.hbtn:hover{color:var(--accent);border-color:rgba(251,191,36,.15)}
.cmp-btn{border-color:rgba(192,132,252,.1);color:rgba(192,132,252,.45)}
.cmp-btn::before{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(192,132,252,.08),transparent 60%)}
.cmp-btn:hover{border-color:rgba(192,132,252,.28);color:#c084fc}
.cmp-btn.active{background:rgba(192,132,252,.07);border-color:rgba(192,132,252,.4);color:#c084fc;box-shadow:0 0 0 1px rgba(192,132,252,.3),0 0 12px rgba(192,132,252,.08);animation:badgePulse 2s ease-in-out infinite}
.discord-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(0,0,0,.3);border:1px solid rgba(88,101,242,.2);border-radius:var(--rx);color:rgba(88,101,242,.6);font-size:.72rem;font-weight:700;text-decoration:none;transition:var(--tr);position:relative;overflow:hidden}
.discord-btn:hover{border-color:rgba(88,101,242,.45);color:#5865f2;transform:translateY(-1px)}
.discord-btn svg{width:14px;height:14px;fill:currentColor}
.tiktok-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;background:linear-gradient(135deg,rgba(236,72,153,.03),rgba(34,211,238,.03));border:1px solid rgba(236,72,153,.18);border-radius:var(--rx);color:rgba(236,72,153,.55);font-size:.72rem;font-weight:700;text-decoration:none;transition:var(--tr);position:relative;overflow:hidden}
.tiktok-btn:hover{border-color:rgba(34,211,238,.4);color:#22d3ee;transform:translateY(-1px)}
.tiktok-btn svg{width:13px;height:13px;fill:currentColor}
.search-bar{position:relative}
.search-bar::before{content:"\1F50D";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.72rem;pointer-events:none;opacity:.3}
.search-bar input{background:var(--surface);border:1px solid var(--border);padding:7px 10px 7px 30px;border-radius:var(--rx);color:var(--text);font-family:inherit;font-size:.78rem;width:170px;outline:none;transition:var(--tr)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar input:focus{border-color:rgba(245,158,11,.3);box-shadow:0 0 0 2px var(--accent-dim),0 0 16px rgba(245,158,11,.05)}
.tabs-wrapper{position:sticky;top:66px;z-index:90;background:rgba(7,10,16,.85);backdrop-filter:blur(16px) saturate(1.1);padding:8px 20px 0;border-bottom:1px solid rgba(255,255,255,.02)}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:5px;padding:6px 13px;background:transparent;border:1px solid transparent;border-radius:var(--rx);cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;white-space:nowrap;transition:var(--tr);letter-spacing:.01em;position:relative;overflow:hidden}
.tab-emoji{font-size:.88rem;position:relative;z-index:1}.tab-text{position:relative;z-index:1}
.tab:hover{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.04)}
.tab-separator{width:1px;background:rgba(255,255,255,.04);margin:0 1px;flex-shrink:0;align-self:stretch}
.tab[data-mode="halloffame"]{color:rgba(251,191,36,.35)}.tab[data-mode="halloffame"].active{color:#fbbf24;border-color:rgba(251,191,36,.45);box-shadow:0 0 0 1px rgba(251,191,36,.4),0 0 12px rgba(251,191,36,.12),inset 0 1px 0 rgba(251,191,36,.08);text-shadow:0 0 8px rgba(251,191,36,.35);background:rgba(251,191,36,.04)}
.tab[data-mode="maintiers"]{color:rgba(34,211,238,.3)}.tab[data-mode="maintiers"].active{color:#22d3ee;border-color:rgba(34,211,238,.45);box-shadow:0 0 0 1px rgba(34,211,238,.4),0 0 12px rgba(34,211,238,.1),inset 0 1px 0 rgba(34,211,238,.06);text-shadow:0 0 8px rgba(34,211,238,.3);background:rgba(34,211,238,.04)}
.tab[data-mode="subtiers"]{color:rgba(192,132,252,.3)}.tab[data-mode="subtiers"].active{color:#c084fc;border-color:rgba(192,132,252,.45);box-shadow:0 0 0 1px rgba(192,132,252,.4),0 0 12px rgba(192,132,252,.1),inset 0 1px 0 rgba(192,132,252,.06);text-shadow:0 0 8px rgba(192,132,252,.3);background:rgba(192,132,252,.04)}
.tab[data-mode="subtiers"] .tab-emoji{color:#c084fc;filter:drop-shadow(0 0 3px rgba(192,132,252,.3))}
.sub-tabs-wrapper{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .25s,padding .3s;padding:0 20px}
.sub-tabs-wrapper.visible{max-height:65px;opacity:1;padding:7px 20px 10px}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{display:flex;align-items:center;height:44px;padding:0 9px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:9px;cursor:pointer;color:var(--text3);font-family:inherit;white-space:nowrap;transition:var(--tr);flex-shrink:0;overflow:hidden;position:relative}
.sub-tab:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06);transform:translateY(-1px)}
.sub-tab-icon{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.sub-tab-icon img{width:26px;height:26px;object-fit:contain;mix-blend-mode:screen;transition:filter .3s}
.sub-tab-label{display:block;max-width:0;opacity:0;overflow:hidden;font-size:.73rem;font-weight:700;transition:max-height .25s,max-width .25s,opacity .12s .02s,padding-left .25s;padding-left:0;white-space:nowrap}
.sub-tab:hover .sub-tab-label{max-width:110px;opacity:.4;padding-left:7px}
.sub-tab.active .sub-tab-icon{transform:scale(1.03)}
.sub-tab.active .sub-tab-label{max-width:120px;opacity:1;padding-left:7px}
.sub-tab-icon-emoji{font-size:20px;line-height:1;display:block}
.sub-tab-star{font-size:22px;line-height:1;display:block;filter:drop-shadow(0 0 2px rgba(251,191,36,.4));animation:stG 2.5s ease-in-out infinite}
.sub-tab.active .sub-tab-star{animation:stGA 2s ease-in-out infinite}
#leaderboard{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding:14px 10px 36px;transition:opacity .12s}
.fade-out{opacity:0}
.player-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 18px;margin-bottom:5px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;animation:fadeRow .35s cubic-bezier(.4,0,.2,1) both}
.player-row::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent)}
.player-row:hover{background:var(--card-hover);border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.02)}
.avatar{width:60px;height:78px;border-radius:6px;border:none;object-fit:cover;object-position:center top;background:#0a0e14;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0}
.avatar-error{visibility:hidden!important}
.player-row:hover .avatar:not(.avatar-error){transform:scale(1.04);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.player-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.name-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank{font-weight:900;font-size:1.5rem;color:var(--text3);min-width:44px;flex-shrink:0;line-height:1;transition:var(--tr)}
.player-name{font-weight:800;font-size:1.1rem;line-height:1.2;transition:var(--tr)}
.player-row:hover .player-name{color:#fff}
.achievement{font-size:.55rem;font-weight:700;padding:1px 7px;border-radius:20px;letter-spacing:.02em;text-transform:uppercase;flex-shrink:0;align-self:flex-start;position:relative;overflow:hidden;display:inline-block;margin-top:1px}
.achievement::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shimmer 3.5s ease-in-out infinite;pointer-events:none}
.achievement.grandmaster{background:linear-gradient(90deg,#fff,#fb7185,#22d3ee,#ec4899,#06b6d4,#fff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 6s linear infinite,gmGlow 4s ease-in-out infinite}
.achievement.master{background:linear-gradient(90deg,#fbbf24,#ef4444,#fb923c,#f59e0b,#f87171,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lgG 7s linear infinite,msGlow 4.5s ease-in-out infinite}
.achievement.ace{background:linear-gradient(90deg,#fb7185,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 5px rgba(251,113,133,.35));animation:lgG 5s linear infinite;background-size:200% 100%}
.achievement.specialist{background:linear-gradient(90deg,#a855f7,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 5px rgba(168,85,247,.35));animation:lgG 6s linear infinite;background-size:200% 100%}
.achievement.cadet{background:rgba(59,130,246,.08);color:#60a5fa}
.achievement.novice{background:rgba(148,163,184,.08);color:#94a3b8}
.achievement.rookie{background:rgba(100,116,139,.06);color:#64748b}
.points{font-size:.84rem;color:var(--text2);font-weight:700;margin-top:1px}
.tiers-grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tier-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 3px 4px;border-radius:6px;cursor:default;border:1px solid transparent;white-space:nowrap;width:46px;min-height:48px;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative}
.tier-badge img{width:19px;height:19px;object-fit:contain;flex-shrink:0;mix-blend-mode:screen;transition:transform .25s}
.tier-badge:hover img{transform:scale(1.1)}
.tb-label{font-size:.56rem;font-weight:800;letter-spacing:.01em;line-height:1}
.tb-peak{font-size:.4rem;font-weight:700;color:var(--pk);opacity:0;transition:all .2s;line-height:1;max-height:0;overflow:hidden}
.tier-badge:hover .tb-peak{opacity:1;max-height:14px}
.tier-badge.HT{background:rgba(251,113,133,.06);color:var(--ht);border-color:rgba(251,113,133,.1)}
.tier-badge.LT{background:rgba(74,222,128,.06);color:var(--lt);border-color:rgba(74,222,128,.1)}
.tier-badge.RHT,.tier-badge.RLT{background:var(--ret-dim);color:var(--retired);border-color:rgba(250,204,21,.06)}
.tier-badge.has-peaked{animation:badgePulse 3s ease-in-out infinite}
.player-row:hover .tier-badge.HT{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.18);transform:translateY(-1px)}
.player-row:hover .tier-badge.LT{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.18);transform:translateY(-1px)}
.player-row:hover .tier-badge.RHT,.player-row:hover .tier-badge.RLT{background:rgba(250,204,21,.1);border-color:rgba(250,204,21,.12);transform:translateY(-1px)}
.top1{border-color:rgba(251,191,36,.15);background:linear-gradient(135deg,rgba(251,191,36,.03) 0%,var(--card) 40%);animation:goldBorder 3s ease-in-out infinite,fadeRow .35s cubic-bezier(.4,0,.2,1) both}
.top1 .rank{color:var(--gold);animation:glG 2.5s ease-in-out infinite}
.top1:hover{box-shadow:0 4px 24px rgba(251,191,36,.06),0 0 0 1px rgba(251,191,36,.08)}
.top2{border-color:rgba(148,163,184,.12);background:linear-gradient(135deg,rgba(148,163,184,.02) 0%,var(--card) 40%);animation:silverBorder 3s ease-in-out infinite,fadeRow .35s cubic-bezier(.4,0,.2,1) both}
.top2 .rank{color:var(--silver);animation:silverGlG 2.5s ease-in-out infinite}
.top2:hover{box-shadow:0 4px 24px rgba(148,163,184,.04)}
.top3{border-color:rgba(217,119,6,.12);background:linear-gradient(135deg,rgba(217,119,6,.02) 0%,var(--card) 40%);animation:bronzeBorder 3s ease-in-out infinite,fadeRow .35s cubic-bezier(.4,0,.2,1) both}
.top3 .rank{color:var(--bronze);animation:bronzeGlG 2.5s ease-in-out infinite}
.top3:hover{box-shadow:0 4px 24px rgba(217,119,6,.04)}

    var ta=a.tiers[modeId],tb=b.tiers[modeId];
    if(!ta&&!tb)return 0;if(!ta)return 1;if(!tb)return -1;
    if(ta.tier!==tb.tier)return ta.tier-tb.tier;
    var taR=isRetired(ta),tbR=isRetired(tb);
    if(taR&&!tbR)return 1;if(!taR&&tbR)return -1;
    return b.points-a.points;
  });
}
function getTierPoints(tier){return(6-tier)*100;}
function getModePoints(p,modeId){
  if(modeId==='overall')return p.points;
  var t=p.tiers[modeId];
  if(!t)return 0;
  return getTierPoints(t.tier);
}
function getModeTier(p,modeId){
  if(modeId==='overall')return getOverallTier(p);
  return p.tiers[modeId]||null;
}

/* ===================== RENDER: TABS ===================== */
function renderTabs(){
  var el=document.getElementById('tabs');
  var html='';
  TABS.forEach(function(tab,i){
    if(i>0)html+='<div class="tab-separator"></div>';
    var cls='tab'+(state.tab===tab.id?' active':'');
    html+='<button class="'+cls+'" data-mode="'+tab.id+'"><span class="tab-emoji">'+tab.emoji+'</span><span class="tab-text">'+tab.label+'</span></button>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      state.tab=this.dataset.mode;
      state.subTab=null;
      state.compare=false;
      state.cmpList=[];
      document.body.classList.remove('compare-active');
      document.getElementById('cmpToggle').classList.remove('active');
      render();
    });
  });
}

/* ===================== RENDER: SUB-TABS ===================== */
function renderSubTabs(){
  var wrap=document.getElementById('subTabsWrapper');
  var el=document.getElementById('subTabs');
  var modes=getModesForTab(state.tab);
  if(!modes.length){wrap.classList.remove('visible');return;}
  wrap.classList.add('visible');
  var allModes=[{id:'overall',name:'Overall',emoji:'\u2B50'}].concat(modes);
  var html='';
  allModes.forEach(function(m){
    var cls='sub-tab'+(state.subTab===m.id?' active':'');
    html+='<button class="'+cls+'" data-mid="'+m.id+'"><div class="sub-tab-icon"><span class="sub-tab-icon-emoji">'+m.emoji+'</span></div><span class="sub-tab-label">'+m.name+'</span></button>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.sub-tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      state.subTab=this.dataset.mid;
      render();
    });
  });
  if(!state.subTab){state.subTab='overall';renderSubTabs();renderContent();}
}

/* ===================== RENDER: CONTENT ROUTER ===================== */
function renderContent(){
  var el=document.getElementById('leaderboard');
  el.classList.add('fade-out');
  setTimeout(function(){
    if(state.tab==='halloffame'){
      renderTierGrid(el);
    } else {
      renderLeaderboard(el);
    }
    el.classList.remove('fade-out');
  },120);
}

/* ===================== RENDER: TIER GRID (Hall of Fame) ===================== */
function renderTierGrid(el){
  /* === CHANGED: Filter out retired (RHT/RLT) and don't show peak tags === */
  var gridData={1:[],2:[],3:[],4:[],5:[]};
  var modes=MAIN_MODES.concat(SUB_MODES);

  PLAYERS.forEach(function(p){
    if(state.search && p.name.toLowerCase().indexOf(state.search.toLowerCase())===-1) return;
    var ot=getOverallTier(p);
    /* Skip retired overall */
    if(ot.type==='RHT'||ot.type==='RLT') return;
    gridData[ot.tier].push({player:p,type:ot.type});
  });

  /* Sort each tier: HT first, then by points desc */
  for(var t=1;t<=5;t++){
    gridData[t].sort(function(a,b){
      if(a.type==='HT'&&b.type!=='HT')return -1;
      if(a.type!=='HT'&&b.type==='HT')return 1;
      return b.player.points-a.player.points;
    });
  }

  var html='<div class="tier-grid">';
  for(var t=1;t<=5;t++){
    html+='<div class="tier-column" data-tier="'+t+'"><div class="tier-title">'+TIER_NAMES[t]+'</div><div class="tier-players">';
    if(gridData[t].length===0){
      html+='<div class="ae">No players</div>';
    } else {
      gridData[t].forEach(function(entry){
        var p=entry.player;
        /* === CHANGED: No peak tag rendered === */
        html+='<div class="player '+entry.type+'" data-pname="'+esc(p.name)+'">';
        html+='<img src="'+esc(p.avatar)+'" alt="" onerror="this.classList.add(\'avatar-error\')">';
        html+='<span class="pnc">'+esc(p.name)+'</span>';
        html+='<span class="pps">'+p.points+'</span>';
        /* Peak tag intentionally omitted */
        html+='</div>';
      });
    }
    html+='</div></div>';
  }
  html+='</div>';
  el.innerHTML=html;
  bindPlayerClicks(el);
}

/* ===================== RENDER: LEADERBOARD ===================== */
function renderLeaderboard(el){
  var modeId=state.subTab||'overall';
  var modes=getModesForTab(state.tab);
  var displayModes=modeId==='overall'?modes:modes.filter(function(m){return m.id===modeId;});

  /* === CHANGED: When a specific gamemode is clicked, filter out retired players === */
  var filteredPlayers=PLAYERS.slice();
  if(modeId!=='overall'){
    filteredPlayers=filteredPlayers.filter(function(p){
      var t=p.tiers[modeId];
      if(!t)return false;
      return !isRetired(t);
    });
  }

  /* Search filter */
  if(state.search){
    filteredPlayers=filteredPlayers.filter(function(p){
      return p.name.toLowerCase().indexOf(state.search.toLowerCase())!==-1;
    });
  }

  var sorted=sortPlayers(filteredPlayers,modeId);
  if(!sorted.length){
    el.innerHTML='<div class="te"><div class="ti">\u{1F50D}</div><div class="tt">No players found</div><div class="td">Try adjusting your search or selecting a different gamemode.</div></div>';
    return;
  }

  var html='';
  sorted.forEach(function(p,i){
    var rank=i+1;
    var topCls=rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
    var cmpCls=(state.cmpList.indexOf(p.name)!==-1?' cmp-picked':'');
    var delay=Math.min(i*0.04,0.8);
    html+='<div class="player-row '+topCls+cmpCls+'" data-pname="'+esc(p.name)+'" style="animation-delay:'+delay+'s">';
    html+='<div class="cmp-sel">\u2713</div>';
    html+='<img class="avatar" src="'+esc(p.avatar)+'" alt="" onerror="this.classList.add(\'avatar-error\')">';
    html+='<div class="player-info">';
    html+='<div class="name-line"><span class="rank">'+rank+'</span><span class="player-name">'+esc(p.name)+'</span><span class="achievement '+p.achievement+'">'+p.achievement+'</span></div>';
    html+='<div class="points">'+getModePoints(p,modeId).toLocaleString()+' pts'+(modeId!=='overall'?' \u00B7 '+modeId:'')+'</div>';
    html+='</div>';
    /* Tier badges for all modes in this tab category */
    html+='<div class="tiers-grid">';
    displayModes.forEach(function(m){
      var td=p.tiers[m.id];
      if(!td){
        html+='<div class="tier-badge" style="opacity:.15"><span class="tb-label">\u2014</span></div>';
        return;
      }
      var cls='tier-badge '+td.type;
      var hasPeaked=td.peak<td.tier;
      if(hasPeaked)cls+=' has-peaked';
      html+='<div class="'+cls+'" data-mode="'+m.id+'" data-pname="'+esc(p.name)+'">';
      html+='<img src="'+TIER_ICONS[td.tier]+'" alt="T'+td.tier+'">';
      html+='<span class="tb-label">T'+td.tier+'</span>';
      /* Peak indicator on hover (only in leaderboard, not in Hall of Fame grid) */
      if(hasPeaked){
        html+='<span class="tb-peak">Peak T'+td.peak+'</span>';
      }
      html+='</div>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
  bindPlayerClicks(el);
  bindTierBadges(el);
}

/* ===================== EVENT BINDINGS ===================== */
function bindPlayerClicks(container){
  container.querySelectorAll('.player-row, .player').forEach(function(el){
    el.addEventListener('click',function(e){
      if(state.compare){
        toggleCompare(this.dataset.pname);
        return;
      }
      var p=PLAYERS.find(function(x){return x.name===this.dataset.pname;}.bind(this));
      if(p)showPlayerModal(p);
    });
  });
}
function bindTierBadges(container){
  container.querySelectorAll('.tier-badge[data-mode]').forEach(function(badge){
    badge.addEventListener('mouseenter',function(e){
      showBadgeTooltip(e,this);
    }).addEventListener('mouseleave',hideBadgeTooltip);
  });
}

/* ===================== TOOLTIP ===================== */
var bttEl=document.getElementById('btt');
var bttI=document.getElementById('bttI');
function showBadgeTooltip(e,badge){
  var modeId=badge.dataset.mode;
  var pName=badge.dataset.pname;
  var p=PLAYERS.find(function(x){return x.name===pName;});
  if(!p)return;
  var td=p.tiers[modeId];
  if(!td){hideBadgeTooltip();return;}
  var mode=ALL_MODES.find(function(m){return m.id===modeId;});
  var mLabel=mode?mode.name:modeId;
