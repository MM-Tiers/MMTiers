<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 900px; margin: auto; }

        .player-row {
            display: grid;
            grid-template-columns: 50px 250px 120px 1fr;
            background: var(--card-bg);
            margin-bottom: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            align-items: center;
            border: 1px solid #333;
        }

        .rank { font-weight: bold; color: #555; font-size: 1.1rem; }
        
        .player-info { display: flex; align-items: center; gap: 15px; }
        
        /* Steve Face as requested */
        .avatar { 
            width: 40px; 
            height: 40px; 
            image-rendering: pixelated; 
            border-radius: 4px;
        }

        .points { color: var(--point-color); font-weight: bold; }

        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 900;
        }
        
        .mode-icon-img {
            width: 18px;
            height: 18px;
            image-rendering: pixelated;
        }

        /* HT and LT colors based on API pos value */
        .HT { background: rgba(255, 71, 87, 0.1); color: var(--ht-color); border: 1px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.1); color: var(--lt-color); border: 1px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom: 30px;">Overall Rankings</h1>
    <div id="leaderboard">Loading...</div>
</div>

<script>
    // Updated Icon Map with your provided links
    const iconMap = {
        "crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png/revision/latest?cb=20191218004335",
        "sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png/revision/latest/scale-to-width/360?cb=20201017135722",
        "mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png/revision/latest?cb=20240317084754",
        "smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png/revision/latest/thumbnail/width/360/height/360?cb=20200512195721",
        "dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png?d45f1",
        "dsmp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/e/ef/Cobweb_%28texture%29_JE0_BE0.png/revision/latest?cb=20200927181248",
        "netpot": "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png?8e866",
        "uhc": "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827",
        "axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png/revision/latest/scale-to-width/360?cb=20200226193844"
    };

    function createTierBadge(modeName, data) {
        // pos: 0 = HT, pos: 1 = LT
        const type = (data.pos === 0) ? 'HT' : 'LT';
        const iconUrl = iconMap[modeName.toLowerCase()];
        const iconHtml = iconUrl ? `<img src="${iconUrl}" class="mode-icon-img">` : "";
        
        return `<span class="tier-badge ${type}">${iconHtml}${type}${data.tier}</span>`;
    }

    async function loadLeaderboard() {
        const board = document.getElementById('leaderboard');
        try {
            // Fetching from your working file name
            const response = await fetch('api-1.json'); 
            if (!response.ok) throw new Error("Could not find api-1.json");
            
            const players = await response.json();
            players.sort((a, b) => b.points - a.points);

            board.innerHTML = players.map((p, i) => `
                <div class="player-row">
                    <div class="rank">#${i + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/avatar/steve/100">
                        <strong>${p.name}</strong>
                    </div>
                    <div class="points">${p.points} PTS</div>
                    <div class="tiers-list">
                        ${Object.entries(p.rankings).map(([mode, data]) => createTierBadge(mode, data)).join('')}
                    </div>
                </div>
            `).join('');

        } catch (err) {
            board.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
    }

    loadLeaderboard();
</script>
</body>
</html>
