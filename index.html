<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers Leaderboard</title>

<style>
:root {
    --bg: #0b1220;
    --card: #111a2e;
    --card2: #0f172a;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #f59e0b;
    --ht: #fb7185;
    --lt: #4ade80;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: var(--text);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: rgba(15,23,42,0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #1f2937;
}

header h1 {
    font-size: 1.8rem;
    color: var(--accent);
    margin: 0;
}

.search-bar input {
    background: #020617;
    border: 1px solid #1f2937;
    padding: 10px 14px;
    border-radius: 10px;
    color: white;
    width: 220px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}




.player-row {
    display: grid;
    grid-template-columns: 70px 300px 180px 1fr;
    background: linear-gradient(145deg, #020617, #0f172a);
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 18px 25px;
    margin-bottom: 12px;
    align-items: center;
    transition: 0.2s;
}

.player-row:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.rank {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--accent);
}

.player-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar {
    width: 50px;
    height: 50px;
    border-radius: 8px;
}

.player-name {
    font-size: 1.2rem;
    font-weight: 600;
}

.points {
    color: var(--accent);
    font-weight: bold;
}

.tiers-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tier-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: bold;
}

.tier-badge img {
    width: 18px;
    height: 18px;
}

.HT {
    background: rgba(251,113,133,0.15);
    color: var(--ht);
    border: 1px solid var(--ht);
}

.LT {
    background: rgba(74,222,128,0.15);
    color: var(--lt);
    border: 1px solid var(--lt);
}

.error {
    text-align: center;
    margin-top: 40px;
    color: #f87171;
}

@media(max-width: 900px) {
    .player-row {
        grid-template-columns: 60px 1fr;
    }

    .points {
        grid-column: span 2;
    }

    .tiers-list {
        grid-column: span 2;
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>MMTiers</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
</header>

<div class="container"><div id="leaderboard">Loading rankings...</div>
</div>

<script>
const iconMap = {
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png?10e68"
};

const tierPoints = {
  "HT1": 60, "LT1": 45,
  "HT2": 35, "LT2": 25,
  "HT3": 15, "LT3": 6,
  "HT4": 4, "LT4": 3,
  "HT5": 2, "LT5": 1
};

let leaderboardData = [];

async function loadLeaderboard() {
    try {
        const response = await fetch('api-1.json');
        const data = await response.json();
        leaderboardData = data.map(player => {
            let totalPoints = 0;
            const rankings = player.rankings || {};
            Object.values(rankings).forEach(info => {
                const type = info.pos === 0 ? "HT" : "LT";
                const tierKey = type + info.tier;
                if (tierPoints[tierKey]) totalPoints += tierPoints[tierKey];
            });
            player.points = totalPoints;
            return player;
        });

        leaderboardData.sort((a,b) => b.points - a.points);
        renderLeaderboard();
    } catch(err) {
        document.getElementById("leaderboard").innerHTML =
        `<div class="error">Failed to load api-1.json</div>`;
    }
}

function renderLeaderboard(search = "") {
    const container = document.getElementById('leaderboard');
    container.innerHTML = "";

    const filtered = leaderboardData.filter(player =>
        player.name.toLowerCase().includes(search.toLowerCase())
    );

    if(filtered.length === 0) {
        container.innerHTML = `<div class="error">No players found.</div>`;
        return;
    }

    filtered.forEach((player,index) => {
        const row = document.createElement("div");
        row.className = "player-row";

        let tiersHTML = "";
        const rankings = player.rankings || {};
        Object.entries(rankings).forEach(([mode,info]) => {
            const type = info.pos === 0 ? "HT" : "LT";
            const icon = iconMap[mode.toLowerCase()] || "";
            tiersHTML += `<div class="tier-badge ${type}">
                <img src="${icon}">
                ${type}${info.tier}
            </div>`;
        });

        row.innerHTML = `
        <div class="rank">#${index+1}</div>
        <div class="player-info">
            <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid}/100">
            <span class="player-name">${player.name}</span>
        </div>
        <div class="points">${player.points} pts</div>
        <div class="tiers-list">${tiersHTML}</div>
        `;
        container.appendChild(row);
    });
}

document.getElementById('searchInput').addEventListener('input', e => {
    renderLeaderboard(e.target.value);
});

loadLeaderboard();
</script>

</body>
</html>
