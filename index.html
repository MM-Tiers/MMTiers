<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTiers Leaderboard</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --ht-color: #ff4757; 
            --lt-color: #2ed573;
            --point-color: #ffa502;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 60px;
        }

        .container { max-width: 1400px; margin: auto; }

        h1 { font-size: 4rem; margin-bottom: 50px; font-weight: 800; }

        .player-row {
            display: grid;
            grid-template-columns: 100px 450px 220px 1fr;
            background: var(--card-bg);
            margin-bottom: 20px;
            padding: 40px; 
            border-radius: 20px;
            align-items: center;
            border: 2px solid #222;
        }

        .rank { font-weight: bold; color: #444; font-size: 2.5rem; }
        
        .player-info { display: flex; align-items: center; gap: 30px; }
        
        .avatar { 
            width: 100px; 
            height: 100px; 
            image-rendering: pixelated; 
            border-radius: 10px;
            background: #222;
        }

        .player-name { font-size: 2.5rem; font-weight: 700; }

        .points { color: var(--point-color); font-weight: 800; font-size: 2.2rem; }

        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.8rem; 
            font-weight: 900;
            min-width: fit-content;
        }
        
        .mode-icon-img {
            width: 50px; 
            height: 50px;
            image-rendering: pixelated;
            object-fit: contain; /* FIXES SQUISHING */
        }

        .HT { background: rgba(255, 71, 87, 0.2); color: var(--ht-color); border: 3px solid var(--ht-color); }
        .LT { background: rgba(46, 213, 115, 0.2); color: var(--lt-color); border: 3px solid var(--lt-color); }

        .error { color: #ff4757; text-align: center; margin-top: 50px; font-size: 2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Overall Rankings</h1>
    <div id="leaderboard">Loading...</div>
</div>

<script>
    // Using a different CDN that is more reliable for hotlinking
    const iconMap = {
        "crystal": "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png",
        "sword": "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png",
        "mace": "https://minecraft.wiki/images/Mace_JE1_BE1.png",
        "smp": "https://minecraft.wiki/images/Ender_Pearl_JE3_BE2.png",
        "dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
        "dsmp": "https://minecraft.wiki/images/Cobweb_JE2_BE2.png",
        "netpot": "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png",
        "uhc": "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png",
        "axe": "https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png"
    };

    async function loadLeaderboard() {
        try {
            const response = await fetch('api-1.json');
            const data = await response.json();
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            data.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                let tiersHTML = '';
                // Fix: Accessing tiers from the player object
                if (player.tiers) {
                    Object.entries(player.tiers).forEach(([mode, info]) => {
                        const type = (info.pos === 0) ? 'HT' : 'LT';
                        const icon = iconMap[mode.toLowerCase()] || "";
                        tiersHTML += `
                            <div class="tier-badge ${type}">
                                <img src="${icon}" class="mode-icon-img" crossorigin="anonymous">
                                <span>${type}${info.tier}</span>
                            </div>
                        `;
                    });
                }

                row.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <div class="player-info">
                        <img class="avatar" src="https://mc-heads.net/avatar/${player.uuid || 'steve'}/100" alt="head">
                        <span class="player-name">${player.name}</span>
                    </div>
                    <div class="points">${player.points} pts</div>
                    <div class="tiers-list">${tiersHTML}</div>
                `;
                container.appendChild(row);
            });
        } catch (err) {
            document.getElementById('leaderboard').innerHTML = `<div class="error">Data load failed. Check api-1.json</div>`;
            console.error(err);
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
