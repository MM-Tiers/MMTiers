<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0b1220;
    --text: #e5e7eb;
    --accent: #f59e0b;
    --ht: #fb7185;
    --lt: #4ade80;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: var(--text);
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid #1f2937;
}

header h1 {
    color: var(--accent);
    margin: 0;
}

.search-bar input {
    background: #020617;
    border: 1px solid #1f2937;
    padding: 10px;
    border-radius: 10px;
    color: white;
    width: 220px;
}

/* TABS */
.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px;
}

.tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #020617;
    border: 1px solid #1f2937;
    border-radius: 10px;
    cursor: pointer;
    color: white;
}

.tab img { width: 16px; }

.tab.active {
    background: var(--accent);
    color: black;
}

/* PLAYER ROW */
.player-row {
    display: grid;
    grid-template-columns: 50px 1fr 100px 1fr;
    padding: 14px;
    margin: 10px;
    background: linear-gradient(145deg, #020617, #0f172a);
    border-radius: 14px;
    border: 1px solid #1f2937;
    transition: 0.2s;
}

.player-row:hover {
    transform: translateY(-2px);
}

.rank { color: var(--accent); font-weight: bold; }

.player-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar { width: 36px; border-radius: 6px; }

.tiers-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.tier-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 7px;
    border-radius: 6px;
    font-size: 0.75rem;
}

.tier-badge img { width: 14px; }

.HT { background: rgba(251,113,133,0.15); color: var(--ht); }
.LT { background: rgba(74,222,128,0.15); color: var(--lt); }

/* GRID */
.tier-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    padding: 10px;
}

.tier-column {
    background: #0f172a;
    border: 1px solid #1f2937;
    border-radius: 10px;
    padding: 10px;
}

.tier-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 8px;
    color: var(--accent);
}

.player {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px;
    margin-bottom: 5px;
    border-radius: 6px;
    background: #020617;
    font-size: 0.8rem;
}

.player img { width: 22px; border-radius: 4px; }

.player.HT { border-left: 3px solid var(--ht); }
.player.LT { border-left: 3px solid var(--lt); }

/* MOBILE */
@media (max-width: 768px) {
    .tier-grid { grid-template-columns: repeat(2, 1fr); }
    .player-row { grid-template-columns: 40px 1fr; }
}
</style>
</head>

<body>

<header>
    <h1>MMTiers</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard">Loading...</div>

<script>
const iconMap = {
"crystal":"https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"sword":"https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"uhc":"https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp":"https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dsmp":"https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"netpot":"https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"dpot":"https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"cart":"https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png",
"mace":"https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"axe":"https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"overall":"https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
};

const modes = Object.keys(iconMap);

const tierPoints = {
"HT1":60,"LT1":45,"HT2":35,"LT2":25,
"HT3":15,"LT3":6,"HT4":4,"LT4":3,"HT5":2,"LT5":1
};

let data = [];
let currentMode = "overall";

/* INIT */
init();

async function init(){
    createTabs();
    await loadData();
    render();
}

/* LOAD */
async function loadData(){
    try{
        const res = await fetch("api-1.json");
        data = await res.json();
    }catch(e){
        document.getElementById("leaderboard").innerHTML = "Failed to load data.";
    }
}

/* TABS */
function createTabs(){
    const tabs = document.getElementById("tabs");
    modes.forEach(m=>{
        const btn = document.createElement("button");
        btn.className = "tab";
        if(m==="overall") btn.classList.add("active");
        btn.innerHTML = `<img src="${iconMap[m]}"> ${m}`;
        btn.onclick = ()=>{
            currentMode = m;
            document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
            btn.classList.add("active");
            render();
        };
        tabs.appendChild(btn);
    });
}

/* POINTS */
function getPoints(p){
    let pts=0;
    Object.values(p.rankings||{}).forEach(r=>{
        const type = r.pos===0?"HT":"LT";
        pts += tierPoints[type+r.tier]||0;
    });
    return pts;
}

/* RENDER */
function render(){
    const container = document.getElementById("leaderboard");
    const search = document.getElementById("searchInput").value.toLowerCase();

    let players = data.filter(p=>p.name.toLowerCase().includes(search));

    container.innerHTML="";

    if(currentMode==="overall"){
        players = players.map(p=>({...p,points:getPoints(p)}))
                         .sort((a,b)=>b.points-a.points);

        players.forEach((p,i)=>{
            const row=document.createElement("div");
            row.className="player-row";

            let tiers="";
            Object.entries(p.rankings||{}).forEach(([m,r])=>{
                const type=r.pos===0?"HT":"LT";
                tiers+=`<div class="tier-badge ${type}">
                <img src="${iconMap[m]}">${type}${r.tier}</div>`;
            });

            row.innerHTML=`
            <div class="rank">#${i+1}</div>
            <div class="player-info">
                <img class="avatar" src="https://mc-heads.net/avatar/${p.uuid}/100">
                ${p.name}
            </div>
            <div>${p.points}</div>
            <div class="tiers-list">${tiers}</div>
            `;

            container.appendChild(row);
        });
        return;
    }

    /* MODE VIEW */
    const tiers={1:[],2:[],3:[],4:[],5:[]};

    players.forEach(p=>{
        const r=p.rankings?.[currentMode];
        if(!r) return;
        tiers[r.tier].push({...p,pos:r.pos});
    });

    const grid=document.createElement("div");
    grid.className="tier-grid";

    for(let t=1;t<=5;t++){
        const col=document.createElement("div");
        col.className="tier-column";
        col.innerHTML=`<div class="tier-title">Tier ${t}</div>`;

        tiers[t].sort((a,b)=>a.pos-b.pos);

        tiers[t].forEach(p=>{
            const div=document.createElement("div");
            div.className=`player ${p.pos===0?"HT":"LT"}`;
            div.innerHTML=`<img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}`;
            col.appendChild(div);
        });

        grid.appendChild(col);
    }

    container.appendChild(grid);
}

/* SEARCH */
document.getElementById("searchInput")
.addEventListener("input",render);

</script>

</body>
</html>
