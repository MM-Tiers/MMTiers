<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTiers</title>
<style>
:root {
  --bg: #0b1220;
  --text: #e5e7eb;
  --accent: #f59e0b;
  --ht: #fb7185;
  --lt: #4ade80;
}

/* BODY */
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: var(--text);
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: rgba(11,18,32,0.8);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid #1f2937;
}

header h1 {
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 1px;
  font-size: 1.8rem;
}

/* SEARCH BAR */
.search-bar input {
  padding: 0.5rem 1rem;
  border-radius: 12px;
  background: rgba(2,6,23,0.7);
  border: 1px solid #1f2937;
  color: var(--text);
  outline: none;
  transition: all 0.2s ease;
}

.search-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(245,158,11,0.5);
}

/* TABS */
.tabs {
  display: flex;
  overflow-x: auto;
  padding: 1rem 2rem;
  gap: 0.5rem;
}

.tab {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  background: rgba(2,6,23,0.7);
  border-radius: 999px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.25s ease;
  flex-shrink: 0;
}

.tab:hover {
  transform: scale(1.05);
}

.tab.active {
  background: var(--accent);
  color: #111827;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(245,158,11,0.4);
}

/* LEADERBOARD GRID */
#leaderboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
  padding: 1rem 2rem;
}

/* PLAYER CARD */
.player-card {
  background: rgba(17,24,39,0.85);
  border-radius: 16px;
  padding: 1rem;
  border: 1px solid #1f2937;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
}

.player-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.7);
}

.player-card .rank {
  font-weight: bold;
  color: var(--accent);
  font-size: 1.1rem;
}

.player-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.player-info img {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  object-fit: cover;
}

.player-points {
  font-weight: 500;
  margin-top: 0.25rem;
}

/* TIER BADGES */
.tiers-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.tier-badge {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.25rem 0.7rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 500;
  transition: all 0.3s ease;
}

.HT {
  background: rgba(251,113,133,0.2);
  color: var(--ht);
  box-shadow: 0 0 6px rgba(251,113,133,0.4);
  animation: pulseHT 2s infinite alternate;
}

.LT {
  background: rgba(74,222,128,0.2);
  color: var(--lt);
  box-shadow: 0 0 6px rgba(74,222,128,0.4);
  animation: pulseLT 2s infinite alternate;
}

@keyframes pulseHT {
  0% { transform: scale(1); }
  100% { transform: scale(1.05); }
}

@keyframes pulseLT {
  0% { transform: scale(1); }
  100% { transform: scale(1.05); }
}

.player-card img {
  border-radius: 8px;
}

/* SCROLLBAR */
.tabs::-webkit-scrollbar {
  height: 6px;
}
.tabs::-webkit-scrollbar-thumb {
  background: #1f2937;
  border-radius: 3px;
}
</style>
</head>
<body>

<header>
  <h1>MMTiers</h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search player...">
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="leaderboard"></div>

<script>
// ICONS & MODES
const iconMap = {
"crystal": "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png",
"sword": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Diamond_Sword_JE3_BE3.png",
"uhc": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png",
"smp": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png",
"dsmp": "https://cdn.modrinth.com/data/iRzrwt7J/images/82d35276aeaa0d03900fc7e8d74996e7d8135917.png",
"netpot": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0f/Netherite_Sword_JE2_BE2.png",
"dpot": "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png",
"cart": "https://minecraft.wiki/images/Minecart_with_TNT_JE2_BE2.png",
"mace": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png",
"axe": "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png",
"overall": "https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
};

const modes = ["overall","crystal","sword","uhc","smp","dsmp","netpot","dpot","cart","mace","axe"];
const tierPoints = { "HT1":60,"LT1":45,"HT2":35,"LT2":25,"HT3":15,"LT3":6,"HT4":4,"LT4":3,"HT5":2,"LT5":1};

let leaderboardData = [];
let currentMode = "overall";

// CREATE TABS
const tabsDiv = document.getElementById("tabs");
modes.forEach(mode => {
    const btn = document.createElement("button");
    btn.className = "tab";
    if(mode==="overall") btn.classList.add("active");
    btn.innerHTML = `<img src="${iconMap[mode]}" width="16"> ${mode}`;
    btn.onclick = ()=>{currentMode=mode;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderLeaderboard();};
    tabsDiv.appendChild(btn);
});

// LOAD DATA
async function loadLeaderboard() {
    const res = await fetch('api-1.json'); // Your JSON
    leaderboardData = await res.json();
    renderLeaderboard();
}

// RENDER
function renderLeaderboard(search=""){
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";
    let players = leaderboardData.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

    if(currentMode==="overall"){
        players = players.map(p=>{
            let pts=0;
            Object.values(p.rankings||{}).forEach(r=>{
                const type=r.pos===0?"HT":"LT";
                pts+=tierPoints[type+r.tier]||0;
            });
            return {...p, points:pts};
        }).sort((a,b)=>b.points-a.points);

        players.forEach((p,i)=>{
            let tiersHTML="";
            Object.entries(p.rankings||{}).forEach(([mode,info])=>{
                const type = info.pos===0?"HT":"LT";
                tiersHTML+=`<div class="tier-badge ${type}" title="${mode} ${type}${info.tier}"><img src="${iconMap[mode]}" width="16">${type}${info.tier}</div>`;
            });
            const card = document.createElement("div");
            card.className="player-card";
            card.innerHTML=`
                <div class="rank">#${i+1}</div>
                <div class="player-info"><img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}</div>
                <div class="player-points">${p.points} pts</div>
                <div class="tiers-list">${tiersHTML}</div>`;
            container.appendChild(card);
        });
        return;
    }

    // MODE TIER COLUMNS
    const tiers={1:[],2:[],3:[],4:[],5:[]};
    players.forEach(p=>{
        const data=p.rankings?.[currentMode];
        if(!data) return;
        tiers[data.tier].push({name:p.name, uuid:p.uuid, pos:data.pos});
    });

    Object.values(tiers).forEach(arr=>arr.sort((a,b)=>a.pos-b.pos));
    Object.keys(tiers).forEach(t=>{
        tiers[t].forEach(p=>{
            const card = document.createElement("div");
            card.className="player-card "+(p.pos===0?"HT":"LT");
            card.innerHTML=`<div class="player-info"><img src="https://mc-heads.net/avatar/${p.uuid}/100">${p.name}</div>`;
            container.appendChild(card);
        });
    });
}

document.getElementById("searchInput").addEventListener("input", e=>renderLeaderboard(e.target.value));
loadLeaderboard();
</script>
</body>
</html>
